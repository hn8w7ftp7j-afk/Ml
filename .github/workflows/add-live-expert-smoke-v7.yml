name: Add live expert smoke v7

on:
  push:
    branches:
      - feature/gpt-alignment-v7
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: add-live-expert-smoke-v7
  cancel-in-progress: false

jobs:
  patch-test-build:
    if: ${{ !contains(github.event.head_commit.message || '', '[live expert smoke added]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Add bounded multi-model GPT routing and Production integration test
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          def replace_between(text, start, end, replacement, label):
              left = text.find(start)
              if left < 0:
                  raise SystemExit(f'{label}: start missing')
              right = text.find(end, left)
              if right < 0:
                  raise SystemExit(f'{label}: end missing')
              return text[:left] + replacement.rstrip() + '\n\n' + text[right:]

          path = Path('lib/expert.js')
          text = path.read_text()
          text = text.replace("export const EXPERT_VERSION = 'GPT-MLB-RESEARCH-LAYER-2026-08-v1';", "export const EXPERT_VERSION = 'GPT-MLB-RESEARCH-LAYER-2026-08-v2';")

          gateway = '''async function gatewayAssessment(key, model, content, timeoutMs) {
            const deadline = Date.now() + Math.max(2500, timeoutMs);
            const request = async useJsonFormat => {
              const remaining = deadline - Date.now();
              if (remaining < 1200) throw new Error('GPT 研究層逾時');
              const body = {
                model,
                messages: [{ role: 'user', content }],
                temperature: 0,
                max_tokens: 3200,
              };
              if (useJsonFormat) body.response_format = { type: 'json_object' };
              const response = await fetch(GATEWAY, {
                method: 'POST',
                headers: { Authorization: `Bearer ${key}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
                signal: AbortSignal.timeout(remaining),
              });
              const raw = await response.text();
              return { response, raw };
            };

            let result = await request(true);
            if (!result.response.ok && result.response.status === 400 && /response[_ -]?format|json[_ -]?object|unsupported|invalid/i.test(result.raw)) {
              result = await request(false);
            }
            if (!result.response.ok) throw new Error(`GPT 研究層 ${model} 服務失敗（${result.response.status}）`);
            const payload = JSON.parse(result.raw);
            return cleanGatewayJSON(payload?.choices?.[0]?.message?.content || '');
          }'''
          text = replace_between(text, 'async function gatewayAssessment(', 'export async function buildExpertAssessment', gateway, 'gateway deadline')

          builder = '''export async function buildExpertAssessment({ context, markets, mode = 'auto', timeoutMs = 16000 }) {
            if (mode === 'off') return fallbackExpertAssessment(context, '設定為純統計模式');
            const key = process.env.AI_GATEWAY_API_KEY;
            if (!key) {
              if (mode === 'required') throw new Error('GPT 研究層無法完成：AI_GATEWAY_API_KEY 未設定');
              return fallbackExpertAssessment(context, 'AI_GATEWAY_API_KEY 未設定');
            }

            const keyValue = cacheKey(context, markets);
            const hit = cache.get(keyValue);
            if (hit && hit.expires > Date.now()) return hit.value;

            const models = unique([
              process.env.AI_ANALYSIS_MODEL,
              'openai/gpt-5-mini',
              process.env.AI_MODEL,
              'google/gemini-2.5-flash',
            ]);
            const payload = compactPayload(context, markets);
            const prompt = promptFor(payload);
            const deadline = Date.now() + Math.max(3500, timeoutMs);
            const failures = [];

            for (const model of models) {
              const remaining = deadline - Date.now();
              if (remaining < 1800) break;
              try {
                const parsed = await gatewayAssessment(key, model, prompt, remaining);
                const result = sanitizeExpertAssessment(parsed, context, model);
                cache.set(keyValue, { value: result, expires: Date.now() + 300000 });
                return result;
              } catch (error) {
                failures.push(`${model}：${String(error?.message || error)}`);
              }
            }

            const reason = failures.length ? failures.join('；') : '沒有可用的研究模型';
            if (mode === 'required') throw new Error(`GPT 研究層無法完成：${reason}`);
            return fallbackExpertAssessment(context, `GPT 研究層失敗，已切換統計備援：${reason}`);
          }'''
          text = replace_between(text, 'export async function buildExpertAssessment(', 'export function applyExpertAssessment', builder, 'expert multi-model builder')
          path.write_text(text)

          path = Path('app/api/analyze/route.js')
          text = path.read_text().replace('timeoutMs: 12000,', 'timeoutMs: 16000,')
          path.write_text(text)

          path = Path('scripts/smoke.mjs')
          text = path.read_text().replace("const EXPERT_VERSION = 'GPT-MLB-RESEARCH-LAYER-2026-08-v1';", "const EXPERT_VERSION = 'GPT-MLB-RESEARCH-LAYER-2026-08-v2';")
          marker = "const result = await json(`${BASE}/api/result?gamePk=${game.gamePk}&t=${Date.now()}`, {}, 30000);"
          block = '''const expertSettings = { ...settings, expertMode: 'required' };
          const expertAnalyzed = await json(`${BASE}/api/analyze`, {
            method: 'POST',
            headers: originHeaders,
            body: JSON.stringify({
              game,
              markets: fullMarkets.filter(row => row.market === '全場大小'),
              settings: expertSettings,
            }),
          }, 180000);
          assert.equal(expertAnalyzed.value.expertAssessment.used, true);
          assert.equal(expertAnalyzed.value.expertAssessment.status, 'complete');
          assert.ok(expertAnalyzed.value.expertAssessment.model);
          assert.equal(expertAnalyzed.value.analysis.alignmentAudit.expertLayer.used, true);
          assert.equal(expertAnalyzed.value.analysis.results.length, 2);

          ''' + marker
          if marker not in text:
              raise SystemExit('smoke expert marker missing')
          text = text.replace(marker, block, 1)
          text = replace_once(
              text,
              "  resultEndpoint: true,",
              "  expertLayerUsed: expertAnalyzed.value.expertAssessment.used,\n  expertModel: expertAnalyzed.value.expertAssessment.model,\n  resultEndpoint: true,",
              'smoke output expert',
          )
          path.write_text(text)

          path = Path('README.md')
          text = path.read_text()
          text += '''\n\n### 7.0 研究模型路由\n\n研究判讀層會優先使用 `AI_ANALYSIS_MODEL`；未指定時優先嘗試 OpenAI GPT-5 mini，再於總時間上限內回退至既有 `AI_MODEL` 與 Gemini。正式結果會顯示實際使用模型；Production smoke 會以 required 模式實際呼叫研究層，避免只有程式存在但正式站未真正執行。\n'''
          path.write_text(text)
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Run unit, security and production build checks
        run: npm run build
      - name: Commit live expert smoke
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md lib/expert.js app/api/analyze/route.js scripts/smoke.mjs
          git rm .github/workflows/add-live-expert-smoke-v7.yml
          git commit -m 'Add bounded GPT routing and live Production expert smoke [live expert smoke added]'
          git push origin HEAD:feature/gpt-alignment-v7
