name: Apply Reader 2.0.3 deep hardening

on:
  push:
    branches: [feature/tai888-reader-v1]
    paths:
      - scripts/apply-reader-v203-deep-hardening.mjs
      - scripts/tai888-reader-deep-edge-v203-test.mjs
      - .github/workflows/apply-reader-v203-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tai888-reader-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply deep hardening patch
        run: node scripts/apply-reader-v203-deep-hardening.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Reader targeted verification
        run: |
          node --check reader/background.js
          node --check reader/parser.js
          node --check reader/row-normalizer.js
          node --check reader/tai888-content.js
          node --check reader/popup.js
          node scripts/tai888-reader-dom-v2-test.mjs
          node scripts/tai888-reader-split-row-v2-test.mjs
          node scripts/tai888-reader-content-dom-v2-test.mjs
          node scripts/tai888-reader-pair-flow-v2-test.mjs
          node scripts/tai888-reader-real-board-e2e-v2-test.mjs
          node scripts/tai888-reader-deep-edge-v203-test.mjs
          node scripts/tai888-reader-parser-v2-test.mjs
          node scripts/reader-auth-v2-test.mjs
          node scripts/reader-store-v2-test.mjs
          node scripts/full-spec-audit-v9-4.mjs
      - name: Complete regression, dependency audit and production build
        run: |
          npm test
          npm audit --audit-level=high --omit=dev
          npx next build
      - name: Static security and version audit
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const m = require('./reader/manifest.json');
          if (m.version !== '2.0.3') throw new Error('Reader version mismatch');
          if (m.content_scripts[0].js.join(',') !== 'row-normalizer.js,tai888-content.js') throw new Error('content script order mismatch');
          for (const forbidden of ['cookies', 'webRequest', 'scripting', 'activeTab']) {
            if ((m.permissions || []).includes(forbidden)) throw new Error(`forbidden permission ${forbidden}`);
          }
          const background = fs.readFileSync('reader/background.js', 'utf8');
          if (!background.includes("READER_VERSION = '2.0.3'")) throw new Error('background version mismatch');
          if (!background.includes('expectedGameCount')) throw new Error('completeness guard missing');
          if (!background.includes('pageActivityAt')) throw new Error('liveness guard missing');
          const parser = fs.readFileSync('lib/tai888-reader-parser-v2.js', 'utf8');
          if (!parser.includes('rawTai888ReaderPayloadHash')) throw new Error('server heartbeat hash missing');
          NODE
          ! grep -RInE --exclude-dir=node_modules --exclude-dir=.git '(sk-[A-Za-z0-9_-]{20,}|OPENAI_API_KEY\s*=\s*[^[:space:]]+|THE_ODDS_API_KEY\s*=\s*[^[:space:]]+)' reader app lib scripts
          ! grep -RInE 'chrome\.(cookies|webRequest)|document\.cookie|localStorage[^\n]*(password|secret)' reader
          ! grep -RIn 'xg1.tai888.in' . --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.next
      - name: Commit verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . ':!node_modules' ':!.next'
          git commit -m "Release Tai888 Reader 2.0.3 deep-audit build" || exit 0
          git push origin HEAD:feature/tai888-reader-v1
