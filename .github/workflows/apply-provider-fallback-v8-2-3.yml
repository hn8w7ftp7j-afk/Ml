name: Apply provider fallback v8.2.3
on:
  push:
    branches: [fix/multimodal-provider-fallback-v8-2-3]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: python scripts/apply-provider-fallback-v8-2-3.py
      - run: npm install --no-audit --no-fund --package-lock=false
      - run: npm run build
      - name: Commit verified release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/apply-provider-fallback-v8-2-3.yml scripts/apply-provider-fallback-v8-2-3.py
          git add -A
          git commit -m 'Add bounded cross-provider vision fallback v8.2.3 [verified]'
          git push origin HEAD:fix/multimodal-provider-fallback-v8-2-3
