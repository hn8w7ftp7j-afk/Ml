name: One-time v10.2 score-model repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[v102-score-model-applied]') && !contains(github.event.head_commit.message, '[v102-debug-log]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply patch and capture diagnostics
        run: |
          set +e
          node scripts/apply-v102-score-model-fix.mjs > /tmp/v102-patch.log 2>&1
          PATCH_EXIT=$?
          echo "patch_exit=$PATCH_EXIT" >> /tmp/v102-patch.log
          if [ "$PATCH_EXIT" -eq 0 ]; then
            node scripts/score-model-integrity-v102-test.mjs >> /tmp/v102-patch.log 2>&1
            TARGET_EXIT=$?
            echo "target_test_exit=$TARGET_EXIT" >> /tmp/v102-patch.log
          else
            TARGET_EXIT=99
          fi
          printf '\n--- git diff --stat ---\n' >> /tmp/v102-patch.log
          git diff --stat >> /tmp/v102-patch.log 2>&1
          cp /tmp/v102-patch.log scripts/v102-patch-diagnostic.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/v102-patch-diagnostic.log
          git commit -m "chore: capture v10.2 patch diagnostics [v102-debug-log]"
          git push origin HEAD:main
