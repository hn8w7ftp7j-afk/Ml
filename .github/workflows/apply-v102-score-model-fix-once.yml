name: One-time v10.2 score-model repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[v102-score-model-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-v102-score-model-fix.mjs
      - run: node scripts/score-model-integrity-v102-test.mjs
      - run: npm test
      - run: npm run build
      - name: Commit repaired main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/mlb-context-v11.js lib/joint-score-v11.js lib/joint-score-v12.js lib/analysis-v11.js lib/deterministic-finalizer-v10.js app/page.js scripts/score-model-integrity-v102-test.mjs
          git commit -m "fix: apply v10.2 score model integrity repairs [v102-score-model-applied]"
          git push origin HEAD:main
