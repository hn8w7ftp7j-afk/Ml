name: Assemble GPT MLB v6

on:
  push:
    branches:
      - feature/full-gpt-mlb-engine-v6
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assemble-gpt-mlb-v6
  cancel-in-progress: false

jobs:
  assemble:
    if: ${{ !contains(github.event.head_commit.message || '', '[v6 assembled]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download and verify v6 source bundle
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 3 \
            'https://temp.sh/yYZYe/mlb-v6-source.tar.gz' \
            -o /tmp/mlb-v6-source.tar.gz
          echo '74e56ae80d581a75968baaf71ee683f5622e93dfef9432dd3943fccb074edabd  /tmp/mlb-v6-source.tar.gz' | sha256sum -c -
          tar -xzf /tmp/mlb-v6-source.tar.gz -C .
      - name: Install, test and build
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --package-lock=false
          npm run build
      - name: Commit assembled v6 engine
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEPLOYMENT_VERSION README.md package.json \
            app/layout.js app/page.js app/globals.css \
            app/api/analyze/route.js app/api/health/route.js app/api/vision/route.js \
            lib/analysis.js lib/markets.js lib/mlb.js lib/vision.js \
            scripts/smoke.mjs scripts/test.mjs
          git rm .github/workflows/assemble-v6.yml
          git status --short
          git commit -m 'Assemble full GPT MLB engine v6 [v6 assembled]'
          git push origin HEAD:feature/full-gpt-mlb-engine-v6
