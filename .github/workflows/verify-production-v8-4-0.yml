name: Verify Production v8.4.0

on:
  push:
    branches:
      - verify/production-v8-4-0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund --package-lock=false
      - name: Verify exact Production release and live GPT final scorer
        run: |
          GITHUB_SHA=3b900257ed417cdd50513ba21ec227521baff9a8 \
          SMOKE_URL=https://mlb-positive-ev.vercel.app \
          node scripts/smoke.mjs
