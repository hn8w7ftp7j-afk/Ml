name: Verify deterministic v9 E2E

on:
  push:
    branches: [verify/deterministic-v9-e2e]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund --package-lock=false
      - run: npm run build
      - name: Start local production server
        run: |
          npm start > /tmp/mlb-v9-server.log 2>&1 &
          echo $! > /tmp/mlb-v9-server.pid
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3000/api/health >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/mlb-v9-server.log
          exit 1
      - name: Run full analysis, deterministic replay and frozen reprice
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const BASE = 'http://127.0.0.1:3000';
          const get = async path => {
            const response = await fetch(`${BASE}${path}`, { headers: { 'Cache-Control': 'no-cache' } });
            const text = await response.text();
            let data; try { data = JSON.parse(text); } catch { throw new Error(`${response.status}: ${text.slice(0,500)}`); }
            if (!response.ok || data.ok === false) throw new Error(`${response.status}: ${data.error || text.slice(0,500)}`);
            return data;
          };
          const post = async (path, body) => {
            const response = await fetch(`${BASE}${path}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Origin: BASE, 'Sec-Fetch-Site': 'same-origin' },
              body: JSON.stringify(body),
            });
            const text = await response.text();
            let data; try { data = JSON.parse(text); } catch { throw new Error(`${response.status}: ${text.slice(0,800)}`); }
            if (!response.ok || data.ok === false) throw new Error(`${response.status}: ${data.error || text.slice(0,800)}`);
            return data;
          };
          const health = await get('/api/health');
          assert.equal(health.version, '9.0.0-preview');
          assert.equal(health.deterministicScoring, true);
          assert.equal(health.gptScoringEnabled, false);
          assert.equal(health.scoreFormulaVersion, 'DUAL-EV-BOTTLENECK-2026-08-v1.0.0');
          assert.equal(health.settlementRuleVersion, 'TW-CREDIT-PER-LEG-REBATE-2026-08-v1.0.0');

          const taipeiDay = offset => new Intl.DateTimeFormat('en-CA', {
            timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit',
          }).format(new Date(Date.now() + offset * 86400000));
          let game = null;
          for (let offset = 0; offset < 10 && !game; offset += 1) {
            const schedule = await get(`/api/mlb?date=${taipeiDay(offset)}`);
            game = (schedule.games || []).find(row => row.gamePk && row.awayTeamId && row.homeTeamId && row.awayProbableId && row.homeProbableId && !/Final|In Progress/i.test(row.statusEnglish || '')) || null;
          }
          assert.ok(game, '找不到未開打且雙先發可建模賽事');
          const now = new Date().toISOString();
          const markets = [
            { market:'全場讓分', pick:`${game.home}讓1+50`, water:0.95, lineAsOf:now, sourceType:'ACTUAL_TW_CREDIT', executable:true },
            { market:'全場讓分', pick:`${game.away}受讓1+50`, water:0.95, lineAsOf:now, sourceType:'ACTUAL_TW_CREDIT', executable:true },
            { market:'全場大小', pick:'大8+50', water:0.94, lineAsOf:now, sourceType:'ACTUAL_TW_CREDIT', executable:true },
            { market:'全場大小', pick:'小8+50', water:0.94, lineAsOf:now, sourceType:'ACTUAL_TW_CREDIT', executable:true },
            { market:'上半讓分', pick:`${game.home}讓0平`, water:0.94, lineAsOf:now, sourceType:'ACTUAL_TW_CREDIT', executable:true },
            { market:'上半讓分', pick:`${game.away}受讓0平`, water:0.94, lineAsOf:now, sourceType:'ACTUAL_TW_CREDIT', executable:true },
            { market:'上半大小', pick:'大4+50', water:0.93, lineAsOf:now, sourceType:'ACTUAL_TW_CREDIT', executable:true },
            { market:'上半大小', pick:'小4+50', water:0.93, lineAsOf:now, sourceType:'ACTUAL_TW_CREDIT', executable:true },
          ];
          const settings = { rebateRate:0.015, simulationsPerScenario:500, candidateThreshold:7.2, strongestThreshold:8.5 };
          const first = await post('/api/analyze', { game, markets, settings });
          const second = await post('/api/analyze', { game, markets, settings });
          assert.equal(first.analysis.inputHash, second.analysis.inputHash);
          assert.deepEqual(first.analysis.results.map(row => row.score), second.analysis.results.map(row => row.score));
          assert.equal(first.analysis.scoreFormulaVersion, health.scoreFormulaVersion);
          assert.equal(first.analysis.finalScoreModel, null);
          assert.equal(first.analysis.scoreValidation.deterministic, true);
          assert.equal(first.analysis.scoreValidation.noGptScoring, true);
          assert.ok(first.analysis.results.every(row => row.score == null || row.score <= 8.9));
          assert.ok(first.analysis.results.every(row => row.scoreSource === '固定雙EV短板公式'));
          assert.ok(first.analysis.results.every(row => row.robustEV <= row.weightedEV + 1e-10));

          const repricedMarkets = markets.map((row, index) => index === 0 ? { ...row, water:0.90, lineAsOf:new Date(Date.now()+1000).toISOString() } : row);
          const repriced = await post('/api/reprice', {
            snapshot: first.repriceSnapshot,
            markets: repricedMarkets,
            previousMarkets: markets,
            settings,
          });
          assert.equal(repriced.analysis.analysisType, 'PRICE_ONLY_REPRICE');
          assert.equal(repriced.analysis.distributionReused, true);
          assert.equal(repriced.analysis.distributionId, first.analysis.distributionId);
          assert.equal(repriced.analysis.coreFingerprint, first.analysis.coreFingerprint);
          assert.notEqual(repriced.analysis.priceFingerprint, first.analysis.priceFingerprint);
          assert.notEqual(repriced.analysis.inputHash, first.analysis.inputHash);
          assert.equal(repriced.analysis.finalScoreModel, null);

          console.log(JSON.stringify({
            ok:true,
            game:`${game.away} 對 ${game.home}`,
            inputHash:first.analysis.inputHash,
            distributionId:first.analysis.distributionId,
            scores:first.analysis.results.map(row => ({ market:row.market, pick:row.pick, weightedEV:row.weightedEV, robustEV:row.robustEV, score:row.score, tag:row.tag })),
            repricedScore:repriced.analysis.results.find(row => row.market === '全場讓分' && row.pick === `${game.home}讓1+50`)?.score,
          }, null, 2));
          NODE
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/mlb-v9-server.log || true
