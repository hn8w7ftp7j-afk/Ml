name: Apply null market v7.0.6

on:
  push:
    branches:
      - fix/null-market-v7-0-6
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply null-like market normalization
        run: python scripts/apply-null-market-v7-0-6.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Run unit, security and production build checks
        run: npm run build
      - name: Commit verified repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEPLOYMENT_VERSION README.md package.json app/page.js app/api/health/route.js lib/markets.js scripts/test.mjs
          git rm .github/workflows/apply-null-market-v7-0-6.yml scripts/apply-null-market-v7-0-6.py
          git commit -m 'Treat null-like vision lines as unopened markets v7.0.6 [null market fixed]'
          git push origin HEAD:fix/null-market-v7-0-6
