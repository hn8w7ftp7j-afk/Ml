name: Apply v10.3 EV calibration safety

on:
  push:
    branches: [fix/v103-ev-calibration-safety]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-v103-ev-calibration-safety
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[v103-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v103-ev-calibration-safety
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply context and distribution patch
        run: node scripts/apply-v103-context-joint.mjs
      - name: Apply analysis patch
        run: node scripts/apply-v103-analysis.mjs
      - name: Apply finalizer and server patch
        run: node scripts/apply-v103-finalizer-server.mjs
      - name: Apply UI patch
        run: node scripts/apply-v103-ui.mjs
      - name: Apply release patch
        run: node scripts/apply-v103-release.mjs
      - name: Syntax checks
        run: |
          node --check lib/mlb-run-model-v103.js
          node --check lib/ev-calibration-v103.js
          node --check lib/market-verification-v2.js
          node --check lib/analysis-v11.js
          node --check lib/joint-score-v11.js
          node --check lib/deterministic-finalizer-v10.js
      - name: Targeted regressions
        run: |
          node scripts/ev-calibration-v103-test.mjs
          node scripts/analysis-v11-test.mjs
          node scripts/score-model-integrity-v102-test.mjs
          node scripts/page-reader-automation-v941-test.mjs
      - name: Full tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit verified patch
        run: |
          rm -f scripts/apply-v103-context-joint.mjs \
            scripts/apply-v103-analysis.mjs \
            scripts/apply-v103-finalizer-server.mjs \
            scripts/apply-v103-ui.mjs \
            scripts/apply-v103-release.mjs \
            .github/workflows/apply-v103-ev-calibration-safety.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: qualify extreme EV and de-correlate MLB run model [v103-applied]"
          git push origin HEAD:fix/v103-ev-calibration-safety
