name: Apply auto analyze all v7.1

on:
  push:
    branches:
      - feature/auto-analyze-all-v7-1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-auto-analyze-all-v7-1
  cancel-in-progress: false

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply one-step all-image analysis integration
        run: python scripts/apply-auto-analyze-all-v7-1.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Run unit, security and production build checks
        run: npm run build
      - name: Commit verified integration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEPLOYMENT_VERSION README.md package.json app/page.js app/api/health/route.js lib/batch.js scripts/test.mjs scripts/smoke.mjs
          git rm .github/workflows/apply-auto-analyze-all-v7-1.yml scripts/apply-auto-analyze-all-v7-1.py
          git commit -m 'Auto-analyze all uploaded images and markets v7.1.0 [batch auto analysis applied]'
          git push origin HEAD:feature/auto-analyze-all-v7-1
