name: Apply v9.3 source hardening

on:
  push:
    branches: [feature/odds-fix-tai888-credit-v9-3]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/odds-fix-tai888-credit-v9-3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/harden-v9-3-sources.mjs
      - name: Commit hardened source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/tai888-source.js app/api/credit-lines/route.js
          git diff --cached --quiet && exit 0
          git commit -m "Harden Tai888 visible-page source handling"
          git push origin HEAD:feature/odds-fix-tai888-credit-v9-3
