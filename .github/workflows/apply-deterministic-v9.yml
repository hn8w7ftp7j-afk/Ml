name: Apply deterministic v9 preview

on:
  push:
    branches: [feature/deterministic-ev-engine-v9]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deterministic-v9-preview
  cancel-in-progress: true

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: python scripts/apply-deterministic-v9.py
      - run: npm install --no-audit --no-fund --package-lock=false
      - run: npm run build
      - name: Commit verified preview source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/apply-deterministic-v9.yml scripts/apply-deterministic-v9.py
          git add -A
          git commit -m 'Build deterministic dual-EV scoring and per-leg settlement v9 preview'
          git push origin HEAD:feature/deterministic-ev-engine-v9
