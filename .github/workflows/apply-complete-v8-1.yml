name: Apply complete v8.1

on:
  push:
    branches:
      - fix/complete-production-v8-1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-complete-v8-1
  cancel-in-progress: false

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Repair patcher marker for current vision route
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-complete-v8-1.py')
          text = path.read_text()
          old = "t = one(t, old, new, 'board parse routing')"
          new = '''route_start = t.find("      const prompt = buildVisionPrompt(schedule, Boolean(text))")
          route_end_marker = "      warnings = result.failures || [];"
          route_end = t.find(route_end_marker, route_start)
          if route_start < 0 or route_end < 0:
              raise SystemExit('board parse routing markers missing')
          t = t[:route_start] + new.rstrip() + t[route_end + len(route_end_marker):]'''
          if old not in text:
              raise SystemExit('patcher repair target missing')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Apply complete v8.1 repair
        run: python scripts/apply-complete-v8-1.py
      - name: Generate dense seven-game board fixture
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/generate-dense-board-fixture.py
      - name: Update unit and Production smoke contracts
        run: python scripts/update-complete-tests-v8-1.py
      - name: Keep auto-analysis fixture valid under mirrored tails
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/test.mjs')
          text = path.read_text()
          old = "{ market: '全場讓分', directions: [{ pick: `${away}讓1+50`, water: 0.95 }, { pick: `${home}受讓1+50`, water: 0.95 }] },"
          new = "{ market: '全場讓分', directions: [{ pick: `${away}讓1+50`, water: 0.95 }, { pick: `${home}受讓1-50`, water: 0.95 }] },"
          if old not in text:
              raise SystemExit('auto-analysis mirrored pair marker missing')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Run unit, security and Production build
        run: npm run build
      - name: Commit verified complete release
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEPLOYMENT_VERSION README.md package.json app/page.js app/api/health/route.js app/api/vision/route.js lib/analysis.js lib/markets.js lib/vision.js scripts/test.mjs scripts/smoke.mjs scripts/fixtures/dense-board-7games.b64
          git rm .github/workflows/apply-complete-v8-1.yml scripts/apply-complete-v8-1.py scripts/generate-dense-board-fixture.py scripts/update-complete-tests-v8-1.py
          git commit -m 'Release complete upload vision and GPT execution parity v8.1.0 [complete production]'
          git push origin HEAD:fix/complete-production-v8-1
