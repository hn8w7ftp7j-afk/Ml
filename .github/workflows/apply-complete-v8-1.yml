name: Apply complete v8.1
on:
  push:
    branches: [fix/complete-production-v8-1]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply v8.1 implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-complete-v8-1.py')
          t = p.read_text()
          old = "t = one(t, old, new, 'board parse routing')"
          new = '''route_start = t.find("      const prompt = buildVisionPrompt(schedule, Boolean(text))")
          route_end_marker = "      warnings = result.failures || [];"
          route_end = t.find(route_end_marker, route_start)
          if route_start < 0 or route_end < 0:
              raise SystemExit('board parse routing markers missing')
          t = t[:route_start] + new.rstrip() + t[route_end + len(route_end_marker):]'''
          if old not in t:
              raise SystemExit('patcher marker missing')
          p.write_text(t.replace(old, new, 1))
          PY
          python scripts/apply-complete-v8-1.py

      - name: Normalize generated source to authoritative Taiwan contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          # Repair generated multiline JS prompt.
          p = Path('app/api/vision/route.js')
          t = p.read_text()
          bad = "const prompt = buildVisionPrompt(schedule, Boolean(text)) + (completenessPass ? '\n這是完整性補掃：每個可見對戰都不可漏；市場看不清可 null。' : '');".replace('\\n', '\n')
          good = "const prompt = buildVisionPrompt(schedule, Boolean(text)) + (completenessPass ? `\\n這是完整性補掃：每個可見對戰都不可漏；市場看不清可 null。` : '');"
          t = t.replace(bad, good)
          p.write_text(t)

          # The Taiwanese tail belongs to the quoted market and stays identical on both directions.
          # Directional settlement already makes the two contracts exact opposites.
          p = Path('lib/markets.js')
          t = p.read_text()
          t = t.replace(
              "      if (!sameTaiwanLineBase(rows[0].pick, rows[1].pick)) errors.push('大小盤兩邊總分線不一致');\n      else if (!mirroredTaiwanPair(rows[0].pick, rows[1].pick)) errors.push('大小盤正反方向尾數必須鏡像');",
              "      if (extractLineToken(rows[0].pick) !== extractLineToken(rows[1].pick)) errors.push('大小盤兩邊總分線不一致');",
          )
          t = t.replace(
              "      if (!sameTaiwanLineBase(rows[0].pick, rows[1].pick)) errors.push('讓分盤兩邊盤口不一致');\n      else if (!mirroredTaiwanPair(rows[0].pick, rows[1].pick)) errors.push('讓分盤正反方向尾數必須鏡像');",
              "      if (extractLineToken(rows[0].pick) !== extractLineToken(rows[1].pick)) errors.push('讓分盤兩邊盤口不一致');",
          )
          t = t.replace('      const oppositeLine = mirrorTaiwanLineToken(line);\n', '')
          t = t.replace('`小${oppositeLine}`', '`小${line}`')
          t = t.replace('`${underdog}受讓${oppositeLine}`', '`${underdog}受讓${line}`')
          p.write_text(t)

          p = Path('README.md')
          t = p.read_text()
          t = t.replace(
              '大小與讓分正反方向的尾數自動鏡像（如大8-80／小8+80、讓2+60／受讓2-60）',
              '大小與讓分正反方向使用同一台灣盤尾數（如大8-80／小8-80、讓2+60／受讓2+60），並由方向結算保持互補',
          )
          p.write_text(t)
          PY

      - name: Generate dense-board fixture and align tests
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/generate-dense-board-fixture.py
          python scripts/update-complete-tests-v8-1.py
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/test.mjs')
          t = p.read_text()
          replacements = {
              "assert.deepEqual(validateMarketPair('全場大小', [{ pick: '大8+50', water: 0.94 }, { pick: '小8-50', water: null }]), []);": "assert.deepEqual(validateMarketPair('全場大小', [{ pick: '大8+50', water: 0.94 }, { pick: '小8+50', water: null }]), []);",
              "assert.ok(validateMarketPair('全場大小', [{ pick: '大8+50', water: 0.94 }, { pick: '小8+50', water: 0.94 }]).some(error => error.includes('尾數必須鏡像')));": "assert.deepEqual(validateMarketPair('全場大小', [{ pick: '大8+50', water: 0.94 }, { pick: '小8+50', water: 0.94 }]), []);",
              "assert.equal(vision.markets[0].directions[1].pick, `${home}受讓1-50`);": "assert.equal(vision.markets[0].directions[1].pick, `${home}受讓1+50`);",
              "assert.equal(vision.markets[1].directions[1].pick, '小8-50');": "assert.equal(vision.markets[1].directions[1].pick, '小8+50');",
              "{ market: '全場讓分', pick: `${home}受讓1-10`, water: 0.95, confidence: 1 },": "{ market: '全場讓分', pick: `${home}受讓1+10`, water: 0.95, confidence: 1 },",
              "{ market: '全場大小', pick: '小8-90', water: 0.94, confidence: 1 },": "{ market: '全場大小', pick: '小8+90', water: 0.94, confidence: 1 },",
              "{ market: '上半大小', pick: '小4-50', water: 0.93, confidence: 1 },": "{ market: '上半大小', pick: '小4+50', water: 0.93, confidence: 1 },",
              "{ market: '全場大小', pick: '小8-50', water: null, confidence: 1 },": "{ market: '全場大小', pick: '小8+50', water: null, confidence: 1 },",
              "missing.results.find(row => row.pick === '小8-50')": "missing.results.find(row => row.pick === '小8+50')",
              "{ market: '全場大小', pick: '小8-50', water: 0.94, waterEstimated: true, confidence: 1 },": "{ market: '全場大小', pick: '小8+50', water: 0.94, waterEstimated: true, confidence: 1 },",
              "assert.ok(Math.abs(pair[0].score - pair[1].score) < 6, `${marketName} 分數差距過度機械化`);": "assert.ok(!(Number(pair[0].score) > 5 && Number(pair[1].score) > 5), `${marketName} 相反方向不可同時高於5分`);",
          }
          for old, new in replacements.items():
              t = t.replace(old, new)
          p.write_text(t)

          p = Path('scripts/smoke.mjs')
          t = p.read_text()
          replacements = {
              "assert.ok(picksFor(990002).includes('明尼蘇達雙城受讓2-60'));": "assert.ok(picksFor(990002).includes('明尼蘇達雙城受讓2+60'));",
              "assert.ok(picksFor(990003).includes('小10-10'));": "assert.ok(picksFor(990003).includes('小10+10'));",
              "{ market: '全場讓分', pick: `${game.away}受讓1-50`, water: 0.95, confidence: 1 },": "{ market: '全場讓分', pick: `${game.away}受讓1+50`, water: 0.95, confidence: 1 },",
              "{ market: '全場大小', pick: '小8-50', water: 0.94, confidence: 1 },": "{ market: '全場大小', pick: '小8+50', water: 0.94, confidence: 1 },",
              "{ market: '上半大小', pick: '小4-50', water: 0.93, confidence: 1 },": "{ market: '上半大小', pick: '小4+50', water: 0.93, confidence: 1 },",
              "{ market: '全場大小', pick: '小8-50', water: null, confidence: 1 },": "{ market: '全場大小', pick: '小8+50', water: null, confidence: 1 },",
              "const noScore = missingWater.value.analysis.results.find(row => row.pick === '小8-50');": "const noScore = missingWater.value.analysis.results.find(row => row.pick === '小8+50');",
              "{ market: '全場大小', pick: '小8-50', water: 0.94, waterEstimated: true, confidence: 1 },": "{ market: '全場大小', pick: '小8+50', water: 0.94, waterEstimated: true, confidence: 1 },",
          }
          for old, new in replacements.items():
              t = t.replace(old, new)
          p.write_text(t)
          PY

      - name: Install and verify complete Production build
        run: |
          npm install --no-audit --no-fund --package-lock=false
          npm run build

      - name: Commit verified v8.1 release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/apply-complete-v8-1.yml scripts/apply-complete-v8-1.py scripts/generate-dense-board-fixture.py scripts/update-complete-tests-v8-1.py
          git add -A
          git commit -m 'Release complete upload vision and GPT execution parity v8.1.0 [complete production]'
          git push origin HEAD:fix/complete-production-v8-1
