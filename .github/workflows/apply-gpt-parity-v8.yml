name: Apply GPT parity v8
on:
  push:
    branches: [fix/gpt-parity-scoring-v8]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: python scripts/apply-gpt-parity-v8.py
      - name: Replace obsolete v7 calibration tests with v8 parity tests
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/smoke.mjs'); s=p.read_text().replace("const VERSION = '7.3.0';","const VERSION = '8.0.0';").replace("const MODEL_VERSION = 'GPT研究整合聯合情境模型-2026-08-v7.0.2';","const MODEL_VERSION = 'GPT完整指令聯合情境模型-2026-08-v8.0.0';").replace("const RULES_VERSION = 'MLB-TW-EXECUTION-2026-08-v7.0.2';","const RULES_VERSION = 'MLB-TW-EXECUTION-2026-08-v8.0.0';").replace('/第\\s*7\\.3\\.0\\s*版/','/第\\s*8\\.0\\.0\\s*版/'); p.write_text(s)
          p=Path('scripts/test.mjs'); s=p.read_text()
          start=s.index("for (const result of analysis.results.filter(row => row.marketAnchorProbability != null)) {")
          end=s.index("\nconst repeat = analyzeMarkets", start)
          replacement='''for (const result of analysis.results.filter(row => row.marketAnchorProbability != null)) {\n  assert.equal(result.marketCalibrationApplied, false);\n  assert.equal(result.marketCalibrationWeight, 0);\n  assert.equal(result.maximumCalibratedProbabilityEdge, null);\n  assert.equal(result.calibratedMarketProbabilityGap, null);\n  assert.ok(Math.abs(result.modelProbability - result.rawModelProbability) < 1e-12);\n  assert.ok(Number.isFinite(result.rawEV));\n  assert.ok(Number.isFinite(result.weightedEV));\n}\n\n// v8 regression: even under strong model/market disagreement, the market price must not shrink the baseball probability.\nconst disagreementContext = structuredClone(context);\nObject.assign(disagreementContext.home.seasonHitting, { runsPerGame: 6.20, ops: 0.900, iso: 0.245 });\nObject.assign(disagreementContext.home.recentHitting, { runsPerGame: 6.50, ops: 0.930, iso: 0.260 });\nObject.assign(disagreementContext.home.lineup, { offensiveIndex: 1.14 });\nObject.assign(disagreementContext.away.seasonHitting, { runsPerGame: 3.20, ops: 0.620, iso: 0.105 });\nObject.assign(disagreementContext.away.recentHitting, { runsPerGame: 3.00, ops: 0.600, iso: 0.095 });\nObject.assign(disagreementContext.away.lineup, { offensiveIndex: 0.86 });\nObject.assign(disagreementContext.away.starter.season, { era: 6.20, fip: 6.00, whip: 1.62, kMinusBB: 0.07, hrPer9: 1.80 });\nObject.assign(disagreementContext.home.starter.season, { era: 2.45, fip: 2.70, whip: 1.02, kMinusBB: 0.22, hrPer9: 0.72 });\nconst disagreement = analyzeMarkets({ context: disagreementContext, markets: markets.filter(row => row.market === '全場讓分'), settings });\nfor (const row of disagreement.results) {\n  assert.equal(row.marketCalibrationApplied, false);\n  assert.ok(Math.abs(row.modelProbability - row.rawModelProbability) < 1e-12);\n}\n'''
          p.write_text(s[:start]+replacement+s[end:])
          PY
      - run: npm install --no-audit --no-fund --package-lock=false
      - run: npm run build
      - name: Commit verified rebuild
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEPLOYMENT_VERSION README.md package.json app/page.js app/api/health/route.js lib/analysis.js lib/markets.js scripts/smoke.mjs scripts/test.mjs
          git rm .github/workflows/apply-gpt-parity-v8.yml scripts/apply-gpt-parity-v8.py
          git commit -m 'Make market price an EV input not probability truth v8.0.0 [GPT parity core]'
          git push origin HEAD:fix/gpt-parity-scoring-v8
