name: Verify Production v8.4.3
on:
  push:
    branches: [verify/production-v8-4-3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Run controlled live anti-ceiling scoring audit
        env:
          BASE: https://mlb-positive-ev.vercel.app
          EXPECTED_SHA: 6b574f71291438f51bae0d480e1d70e8796c9017
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const BASE = process.env.BASE.replace(/\/$/, '');
          const EXPECTED_SHA = process.env.EXPECTED_SHA;
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function json(url, options = {}, timeout = 180000) {
            const response = await fetch(url, {
              ...options,
              signal: AbortSignal.timeout(Math.floor(timeout)),
              headers: { 'Cache-Control': 'no-cache', ...(options.headers || {}) },
            });
            const text = await response.text();
            let value;
            try { value = JSON.parse(text); }
            catch { throw new Error(`非JSON ${response.status}｜${text.slice(0, 400)}`); }
            if (!response.ok || value.ok === false) {
              const error = new Error(`${response.status}｜${value.error || text.slice(0, 800)}`);
              error.status = response.status;
              throw error;
            }
            return value;
          }

          let health;
          for (let i = 0; i < 30; i += 1) {
            try {
              health = await json(`${BASE}/api/health?t=${Date.now()}`, {}, 30000);
              if (health.version === '8.4.3' && health.commit === EXPECTED_SHA) break;
            } catch {}
            await sleep(5000);
          }
          assert.equal(health?.version, '8.4.3');
          assert.equal(health?.commit, EXPECTED_SHA);
          assert.equal(health?.finalScoreVersion, 'GPT-FINAL-EXECUTION-JUDGE-2026-08-v8.4.3');
          assert.equal(health?.aiGatewayConfigured, true);

          const day = offset => new Intl.DateTimeFormat('en-CA', {
            timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit',
          }).format(new Date(Date.now() + offset * 86400000));
          let game = null;
          for (let offset = 0; offset < 8 && !game; offset += 1) {
            const data = await json(`${BASE}/api/mlb?date=${day(offset)}&t=${Date.now()}`, {}, 30000);
            game = (data.games || []).find(row => row.gamePk && row.awayTeamId && row.homeTeamId && row.awayProbableId && row.homeProbableId) || null;
          }
          assert.ok(game, '找不到可建模賽事');

          const markets = [
            { market: '全場讓分', pick: `${game.home}讓1+50`, water: 0.95, confidence: 1 },
            { market: '全場讓分', pick: `${game.away}受讓1+50`, water: 0.95, confidence: 1 },
            { market: '全場大小', pick: '大8+50', water: 0.94, confidence: 1 },
            { market: '全場大小', pick: '小8+50', water: 0.94, confidence: 1 },
            { market: '上半讓分', pick: `${game.home}讓0平`, water: 0.94, confidence: 1 },
            { market: '上半讓分', pick: `${game.away}受讓0平`, water: 0.94, confidence: 1 },
            { market: '上半大小', pick: '大4+50', water: 0.93, confidence: 1 },
            { market: '上半大小', pick: '小4+50', water: 0.93, confidence: 1 },
          ];
          const body = JSON.stringify({
            game,
            markets,
            settings: { rebateRate: 0.015, candidateThreshold: 7.2, strongestThreshold: 8.5, simulationsPerScenario: 500, expertMode: 'off' },
          });

          let response;
          let last = '';
          for (let attempt = 1; attempt <= 3; attempt += 1) {
            try {
              response = await json(`${BASE}/api/analyze`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Origin: BASE, 'Sec-Fetch-Site': 'same-origin' },
                body,
              }, 180000);
              break;
            } catch (error) {
              last = String(error?.message || error);
              if (!/429|rate.?limit|too many requests|額度|credits/i.test(last) || attempt === 3) throw error;
              await sleep(90000);
            }
          }
          assert.ok(response, last || '分析未回傳');
          const analysis = response.analysis;
          assert.equal(analysis.results.length, 8);
          assert.equal(analysis.scenarioSummary.count, 27);
          assert.equal(analysis.finalScoreVersion, 'GPT-FINAL-EXECUTION-JUDGE-2026-08-v8.4.3');
          assert.equal(analysis.scoreValidation.passed, true);
          assert.equal(analysis.scoreValidation.noFixedFormula, true);
          assert.equal(analysis.scoreValidation.latestInstructionWins, true);
          assert.equal(analysis.scoreValidation.modelShapeAudit?.passed, true);
          assert.equal(analysis.scoreValidation.distributionAudit?.passed, true);
          assert.ok(analysis.results.every(row => row.scoreSource === 'GPT 最終 Execution 判讀'));
          assert.ok(analysis.results.every(row => row.scoreAudit?.ok === true));
          assert.ok(analysis.results.every(row => row.scoreBreakdown?.noFixedFormula === true));

          const negatives = analysis.results.filter(row => row.weightedEV <= 0);
          if (negatives.length >= 3) {
            const range = Math.max(...negatives.map(row => row.weightedEV)) - Math.min(...negatives.map(row => row.weightedEV));
            const counts = negatives.reduce((map, row) => map.set(row.score.toFixed(1), (map.get(row.score.toFixed(1)) || 0) + 1), new Map());
            const maximum = Math.max(...counts.values());
            if (range >= 0.03) assert.ok(maximum < Math.max(3, Math.ceil(negatives.length * 0.67)), '負EV方向仍黏在同一分數');
            if (range >= 0.04) assert.ok(negatives.filter(row => row.score >= 6.55).length < Math.max(3, Math.ceil(negatives.length * 0.60)), '仍把6.6當預設分數');
          }

          for (const row of analysis.results) {
            assert.ok(Number.isFinite(row.score) && row.score >= 1 && row.score <= 9.4);
            if (row.weightedEV <= 0) assert.ok(row.score <= 6.6 + 1e-9);
            if (row.weightedEV > 0 && row.robustEV <= 0) assert.ok(row.score <= 7.1 + 1e-9);
            if (row.score >= 7.2) assert.ok(row.weightedEV > 0 && row.robustEV > 0);
          }
          for (const market of ['全場讓分', '全場大小', '上半讓分', '上半大小']) {
            const pair = analysis.results.filter(row => row.market === market);
            assert.equal(pair.length, 2);
            assert.ok(pair.filter(row => row.score >= 7.2).length <= 1);
            assert.ok(pair.filter(row => row.betEligible).length <= 1);
          }

          console.log(JSON.stringify({
            ok: true,
            version: health.version,
            commit: health.commit,
            game: `${game.away} 對 ${game.home}`,
            model: analysis.finalScoreModel,
            modelShapeAudit: analysis.scoreValidation.modelShapeAudit,
            distributionAudit: analysis.scoreValidation.distributionAudit,
            scores: analysis.results.map(row => ({ market: row.market, pick: row.pick, score: row.score, weightedEV: row.weightedEV, robustEV: row.robustEV, eligible: row.betEligible, reason: row.scoreReason })),
          }, null, 2));
          NODE
