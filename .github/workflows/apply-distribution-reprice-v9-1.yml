name: Apply frozen distribution v9.1 preview

on:
  push:
    branches: [feature/deterministic-ev-engine-v9]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frozen-distribution-v9-1-preview
  cancel-in-progress: true

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: python scripts/apply-distribution-reprice-v9-1.py
      - run: npm install --no-audit --no-fund --package-lock=false
      - run: npm run build
      - name: Commit verified v9.1 preview source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/apply-distribution-reprice-v9-1.yml scripts/apply-distribution-reprice-v9-1.py
          git add -A
          git commit -m 'Persist frozen distributions and dual-check precise EV v9.1 preview'
          git push origin HEAD:feature/deterministic-ev-engine-v9
