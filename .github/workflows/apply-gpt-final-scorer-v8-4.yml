name: Apply GPT final scorer v8.4

on:
  push:
    branches:
      - fix/gpt-final-scorer-v8-4-0
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-gpt-final-scorer-v8-4
  cancel-in-progress: false

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Align patcher with current v8.3 source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-gpt-final-scorer-v8-4.py')
          s = p.read_text()

          old = "if (!analysis || analysis.scoreContractVersion !== SCORE_CONTRACT_VERSION || analysis.scoreValidation?.passed !== true) return false;"
          new = "if (!analysis || analysis.scoreContractVersion !== SCORE_CONTRACT_VERSION || analysis.scoreValidation?.passed !== true || analysis.scoreValidation?.distributionAudit?.passed !== true) return false;"
          if old not in s:
              raise SystemExit('snapshot validator source marker missing')
          s = s.replace(old, new, 1)

          old_smoke = """assert.equal(analysis.scoreContractVersion, SCORE_CONTRACT_VERSION);
          assert.equal(analysis.scoreValidation.passed, true);
          assert.ok(analysis.results.every(row => row.scoreAudit?.ok === true));"""
          current_smoke = """assert.equal(analysis.scoreContractVersion, SCORE_CONTRACT_VERSION);
          assert.equal(analysis.scoreValidation.passed, true);
          assert.equal(analysis.scoreValidation.distributionAudit?.passed, true);
          assert.ok(analysis.scoreValidation.distributionAudit?.uniqueDisplayedScores >= 3);
          assert.ok(analysis.results.every(row => row.scoreAudit?.ok === true));
          assert.ok(analysis.results.every(row => row.scoreBreakdown?.version === SCORE_CONTRACT_VERSION));"""
          if old_smoke not in s:
              raise SystemExit('patcher smoke assertion template missing')
          s = s.replace(old_smoke, current_smoke, 1)

          s = s.replace("    'openai/gpt-5.6-terra',\n    'openai/gpt-5.5',\n    'openai/gpt-5.4',", "    'openai/gpt-5',\n    'openai/gpt-5-mini',")
          s = s.replace("process.env.AI_SCORING_MODEL || 'openai/gpt-5.6-sol'", "process.env.AI_SCORING_MODEL || 'openai/gpt-5'")
          p.write_text(s)
          PY

      - name: Apply v8.4 source integration
        run: python scripts/apply-gpt-final-scorer-v8-4.py

      - name: Use verified AI Gateway model fallbacks and strict high-score gates
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/final-scorer.js')
          s = p.read_text()
          old = """  const models = unique([
              process.env.AI_SCORING_MODEL,
              'openai/gpt-5.6-sol',
              'openai/gpt-5.5',
              'openai/gpt-5.4',
              'openai/gpt-5',
              'openai/gpt-5-mini',
            ]);"""
          new = """  const models = unique([
              process.env.AI_SCORING_MODEL,
              'openai/gpt-5',
              'openai/gpt-5-mini',
              'openai/gpt-5-nano',
              'google/gemini-2.5-flash',
            ]);"""
          if old not in s:
              raise SystemExit('final scoring model list marker missing')
          s = s.replace(old, new, 1)

          old = """  if (finite(row.weightedEV, -1) <= 0) {
              cap = Math.min(cap, 6.6);
              reasons.push('加權 EV 非正');
            } else if (finite(row.robustEV, -1) <= 0) {
              cap = Math.min(cap, 7.1);
              reasons.push('穩健 EV 非正');
            }
            return { cap, reasons };"""
          new = """  if (finite(row.weightedEV, -1) <= 0) {
              cap = Math.min(cap, 6.6);
              reasons.push('加權 EV 非正');
            } else if (finite(row.robustEV, -1) <= 0) {
              cap = Math.min(cap, 7.1);
              reasons.push('穩健 EV 非正');
            } else {
              if (finite(row.robustEV, 0) < 0.015 || finite(row.evFlipProbability, 1) > 0.30) {
                cap = Math.min(cap, 7.9);
                reasons.push('穩健優勢仍偏薄或翻負風險偏高');
              }
              if (
                finite(row.robustEV, 0) < 0.035
                || finite(row.evFlipProbability, 1) > 0.15
                || finite(row.confidence, 0) < 0.78
                || finite(row.independentEvidenceStrength, 0) < 0.55
              ) {
                cap = Math.min(cap, 8.4);
                reasons.push('未通過 8.5 最強主推稀有門檻');
              }
            }
            return { cap, reasons };"""
          if old not in s:
              raise SystemExit('final hard cap marker missing')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Run parity, final scorer, unit, security and Production build
        run: npm run build

      - name: Commit verified v8.4 release
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/apply-gpt-final-scorer-v8-4.yml scripts/apply-gpt-final-scorer-v8-4.py
          git add -A
          git commit -m 'Release latest-instruction GPT final execution scorer v8.4.0 [verified]'
          git push origin HEAD:fix/gpt-final-scorer-v8-4-0
