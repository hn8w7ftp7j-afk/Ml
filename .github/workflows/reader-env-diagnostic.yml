name: Diagnose Reader persistence environment

on:
  push:
    branches: [feature/tai888-reader-v1]
    paths: [.github/workflows/reader-env-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read Production health flags
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch('https://mlb-positive-ev.vercel.app/api/health?t=' + Date.now(), { cache: 'no-store' });
          const text = await response.text();
          let value;
          try { value = JSON.parse(text); }
          catch { throw new Error(`Non-JSON health response ${response.status}: ${text.slice(0,500)}`); }
          console.log(JSON.stringify({
            status: response.status,
            ok: value.ok,
            version: value.version,
            databaseConfigured: value.databaseConfigured,
            authConfigured: value.authConfigured,
            creditLinesConfigured: value.creditLinesConfigured,
            aiGatewayConfiguredForVision: value.aiGatewayConfiguredForVision,
          }, null, 2));
          NODE
