name: Apply v9.3.1 single-side water fix

on:
  push:
    branches: [fix/single-side-water-pair-qa-v9-3-1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/single-side-water-pair-qa-v9-3-1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/apply-v9-3-1.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/deterministic-finalizer.js package.json app/api/health/route.js app/page.js DEPLOYMENT_VERSION
          git diff --cached --quiet && exit 0
          git commit -m "Fix single-side actual water complement QA"
          git push origin HEAD:fix/single-side-water-pair-qa-v9-3-1
