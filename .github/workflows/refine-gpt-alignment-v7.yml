name: Refine GPT alignment v7

on:
  push:
    branches:
      - feature/gpt-alignment-v7
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refine-gpt-alignment-v7
  cancel-in-progress: false

jobs:
  refine-test-build:
    if: ${{ !contains(github.event.head_commit.message || '', '[v7 audit hardened]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Harden GPT audit and MLB split inputs
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          def replace_between(text, start, end, replacement, label):
              left = text.find(start)
              if left < 0:
                  raise SystemExit(f'{label}: start missing')
              right = text.find(end, left)
              if right < 0:
                  raise SystemExit(f'{label}: end missing')
              return text[:left] + replacement.rstrip() + '\n\n' + text[right:]

          path = Path('lib/expert.js')
          text = path.read_text()
          merge = '''function mergeAudit(base, supplied) {
            const source = supplied && typeof supplied === 'object' ? supplied : {};
            const prefix = (label, values) => unique(values).map(value => `${label}${value}`);
            return {
              // Only program-collected provenance may be promoted to confirmed or estimated facts.
              confirmed: unique(base.confirmed || []).slice(0, 18),
              estimated: unique(base.estimated || []).slice(0, 18),
              unknown: unique([...(base.unknown || []), ...prefix('GPT 待確認：', source.unknown || [])]).slice(0, 18),
              blocking: unique([...(base.blocking || []), ...prefix('GPT 指出需阻擋：', source.blocking || [])]).slice(0, 10),
              unmodeled: unique([...(base.unmodeled || []), ...prefix('GPT 指出尚未建模：', source.unmodeled || [])]).slice(0, 14),
            };
          }'''
          text = replace_between(text, 'function mergeAudit(', 'export function fallbackExpertAssessment', merge, 'merge audit')
          text = text.replace('"audit":{"confirmed":[],"estimated":[],"unknown":[],"blocking":[],"unmodeled":[]},', '"audit":{"confirmed":[],"estimated":[],"unknown":[],"blocking":[],"unmodeled":[]},')
          text = replace_once(
              text,
              '5. evidenceKeys 只能引用輸入 JSON 中實際存在的欄位名稱或值。\n6. 回傳單一合法 JSON，不要 Markdown、不要解釋。',
              '5. evidenceKeys 只能引用輸入 JSON 中實際存在的欄位名稱或值。audit.confirmed 與 audit.estimated 會由程式來源決定，你不得新增；你只能在 unknown、blocking、unmodeled 補充「需要再確認」的項目。\n6. 回傳單一合法 JSON，不要 Markdown、不要解釋。',
              'prompt evidence rule',
          )

          gateway = '''async function gatewayAssessment(key, model, content, timeoutMs) {
            const request = async useJsonFormat => {
              const body = {
                model,
                messages: [{ role: 'user', content }],
                temperature: 0,
                max_tokens: 3200,
              };
              if (useJsonFormat) body.response_format = { type: 'json_object' };
              const response = await fetch(GATEWAY, {
                method: 'POST',
                headers: { Authorization: `Bearer ${key}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
                signal: AbortSignal.timeout(timeoutMs),
              });
              const raw = await response.text();
              return { response, raw };
            };

            let result = await request(true);
            if (!result.response.ok && result.response.status === 400 && /response[_ -]?format|json[_ -]?object|unsupported|invalid/i.test(result.raw)) {
              result = await request(false);
            }
            if (!result.response.ok) throw new Error(`GPT 研究層服務失敗（${result.response.status}）`);
            const payload = JSON.parse(result.raw);
            return cleanGatewayJSON(payload?.choices?.[0]?.message?.content || '');
          }'''
          text = replace_between(text, 'async function gatewayAssessment(', 'export async function buildExpertAssessment', gateway, 'gateway fallback')
          path.write_text(text)

          path = Path('lib/mlb.js')
          text = path.read_text()
          text = replace_once(
              text,
              "statsEndpoint(`/v1/teams/${teamId}/stats`, { stats: 'season', group: 'hitting', sitCodes: 'vl', season }),",
              "statsEndpoint(`/v1/teams/${teamId}/stats`, { stats: 'statSplits', group: 'hitting', sitCodes: 'vl', season }),",
              'left split type',
          )
          text = replace_once(
              text,
              "statsEndpoint(`/v1/teams/${teamId}/stats`, { stats: 'season', group: 'hitting', sitCodes: 'vr', season }),",
              "statsEndpoint(`/v1/teams/${teamId}/stats`, { stats: 'statSplits', group: 'hitting', sitCodes: 'vr', season }),",
              'right split type',
          )
          path.write_text(text)

          path = Path('scripts/test.mjs')
          text = path.read_text()
          marker = "assert.equal(context.expertAssessment.used, true);"
          addition = '''
          const auditGuard = sanitizeExpertAssessment({
            audit: {
              confirmed: ['invented confirmed fact'],
              estimated: ['invented estimated fact'],
              unknown: ['official roof not confirmed'],
            },
          }, context, 'audit-guard-model');
          assert.equal(auditGuard.assessment.audit.confirmed.includes('invented confirmed fact'), false);
          assert.equal(auditGuard.assessment.audit.estimated.includes('invented estimated fact'), false);
          assert.ok(auditGuard.assessment.audit.unknown.some(value => value.includes('GPT 待確認：official roof not confirmed')));
          '''
          if marker not in text:
              raise SystemExit('audit test marker missing')
          text = text.replace(marker, marker + '\n' + addition, 1)
          path.write_text(text)
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Run unit, security and production build checks
        run: npm run build
      - name: Commit hardened v7 audit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/expert.js lib/mlb.js scripts/test.mjs
          git rm .github/workflows/refine-gpt-alignment-v7.yml
          git commit -m 'Harden GPT evidence audit and MLB split inputs [v7 audit hardened]'
          git push origin HEAD:feature/gpt-alignment-v7
