name: Diagnose v9 client runtime

on:
  push:
    branches: [feature/one-click-reference-board-v9-2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund --package-lock=false
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - name: Start local production server
        run: |
          npm start > /tmp/mlb-client.log 2>&1 &
          for i in $(seq 1 90); do
            curl -fsS http://localhost:3000/api/health >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/mlb-client.log
          exit 1
      - name: Open app in Chromium and WebKit
        run: |
          node --input-type=module <<'NODE'
          import { chromium, webkit } from 'playwright';
          const results = [];
          for (const [name, engine] of [['chromium', chromium], ['webkit', webkit]]) {
            const browser = await engine.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              userAgent: name === 'webkit'
                ? 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'
                : undefined,
            });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(`pageerror: ${error.stack || error.message}`));
            page.on('console', message => {
              if (message.type() === 'error') errors.push(`console: ${message.text()}`);
            });
            const response = await page.goto('http://localhost:3000', { waitUntil: 'networkidle', timeout: 120000 });
            await page.waitForTimeout(2500);
            const text = await page.locator('body').innerText().catch(() => '');
            results.push({ name, status: response?.status(), url: page.url(), errors, body: text.slice(0, 1200) });
            await page.screenshot({ path: `/tmp/${name}.png`, fullPage: true });
            await browser.close();
          }
          console.log(JSON.stringify(results, null, 2));
          if (results.some(row => row.errors.length || /Application error|client-side exception/i.test(row.body))) process.exit(1);
          NODE
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/mlb-client.log || true
