name: Apply v9.3 homepage integration

on:
  push:
    branches: [feature/odds-fix-tai888-credit-v9-3]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/odds-fix-tai888-credit-v9-3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/apply-v9-3-page.mjs
      - name: Commit transformed page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.js
          git diff --cached --quiet && exit 0
          git commit -m "Integrate reference and Tai888 credit sources on homepage"
          git push origin HEAD:feature/odds-fix-tai888-credit-v9-3
