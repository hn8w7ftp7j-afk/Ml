name: Apply v9.3.3 complete input hash

on:
  push:
    branches: [fix/calculation-input-hash-v9-3-3]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/calculation-input-hash-v9-3-3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/apply-v9-3-3.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/analyze/route.js app/api/reprice/route.js lib/analysis-cache-v9.js package.json app/api/health/route.js app/page.js DEPLOYMENT_VERSION
          git diff --cached --quiet && exit 0
          git commit -m "Hash calculation settings and prior-line evidence"
          git push origin HEAD:fix/calculation-input-hash-v9-3-3
