name: Harden auto upload schedule v7.1

on:
  push:
    branches:
      - feature/auto-analyze-all-v7-1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Ensure official schedule before recognition
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/page.js')
          text = path.read_text()

          marker = '''  async function chooseImages(files) {
          '''
          helper = '''  async function scheduleForRecognition() {
            if (games.length) return games;
            setVisionStatus('正在先載入當日 MLB 官方賽程…');
            const data = await requestJSON(`/api/mlb?date=${date}`);
            const schedule = data.games || [];
            setGames(schedule);
            if (!schedule.length) throw new Error('當日沒有可配對的 MLB 官方賽事');
            return schedule;
          }

          ''' + marker
          if marker not in text:
              raise SystemExit('chooseImages marker missing')
          text = text.replace(marker, helper, 1)

          text = text.replace('      await recognizeAndAnalyze(rows);', '      const schedule = await scheduleForRecognition();\n      await recognizeAndAnalyze(rows, schedule);', 1)
          text = text.replace('  async function recognizeAndAnalyze(sourceImages) {', '  async function recognizeAndAnalyze(sourceImages, schedule) {', 1)
          text = text.replace('body: JSON.stringify({ images: [task.data], schedule: games, defaultWater: store.settings.fallbackWater }),', 'body: JSON.stringify({ images: [task.data], schedule, defaultWater: store.settings.fallbackWater }),', 1)
          text = text.replace('      await recognizeAndAnalyze(images);', '      const schedule = await scheduleForRecognition();\n      await recognizeAndAnalyze(images, schedule);', 1)
          text = text.replace("      const data = await requestJSON('/api/vision', {\n        method: 'POST',\n        headers: { 'Content-Type': 'application/json' },\n        body: JSON.stringify({ text: manualText, schedule: games, defaultWater: store.settings.fallbackWater }),\n      });", "      const schedule = await scheduleForRecognition();\n      const data = await requestJSON('/api/vision', {\n        method: 'POST',\n        headers: { 'Content-Type': 'application/json' },\n        body: JSON.stringify({ text: manualText, schedule, defaultWater: store.settings.fallbackWater }),\n      });", 1)
          path.write_text(text)
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Run unit, security and production build checks
        run: npm run build
      - name: Commit verified schedule guard
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.js
          git rm .github/workflows/harden-auto-upload-schedule-v7-1.yml
          git commit -m 'Load official schedule before one-step image analysis [batch schedule guarded]'
          git push origin HEAD:feature/auto-analyze-all-v7-1
