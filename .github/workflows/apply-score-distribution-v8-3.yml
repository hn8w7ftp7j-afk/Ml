name: Apply score distribution v8.3

on:
  push:
    branches:
      - fix/score-distribution-v8-3-0
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-score-distribution-v8-3
  cancel-in-progress: false

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply v8.3 score distribution patch
        run: python scripts/apply-score-distribution-v8-3.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Run score parity, unit, security and Production build
        run: npm run build
      - name: Commit verified release
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/apply-score-distribution-v8-3.yml scripts/apply-score-distribution-v8-3.py
          git add -A
          git commit -m 'Release continuous GPT score distribution and anti-clustering validation v8.3.0 [verified]'
          git push origin HEAD:fix/score-distribution-v8-3-0
