name: Apply score distribution v8.3

on:
  push:
    branches:
      - fix/score-distribution-v8-3-0
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-score-distribution-v8-3
  cancel-in-progress: false

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply v8.3 score distribution patch
        run: python scripts/apply-score-distribution-v8-3.py
      - name: Keep every score recomputation input identical
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('lib/analysis.js')
          s = p.read_text()
          old = '''      const scoreAudit = validateScoreContract(score, conservativeEV, {
                weightedEV,
                robustEV: robust.robustEV,
                flipProbability: evFlipProbability,
                quality: profile.quality,
                integrityWarning: integrity.warning,
                waterEstimated,
                modelErrorFloor: profile.modelErrorFloor,
                independentEvidence: profile.independentEvidenceStrength,
              });'''
          new = '''      const scoreAudit = validateScoreContract(score, conservativeEV, {
                weightedEV,
                robustEV: robust.robustEV,
                flipProbability: evFlipProbability,
                quality: profile.quality,
                edgeStrength,
                stability,
                integrityWarning: integrity.warning,
                waterEstimated,
                modelErrorFloor: profile.modelErrorFloor,
                independentEvidence: profile.independentEvidenceStrength,
                divergenceRisk: calibration.divergenceRisk,
              });'''
          if old not in s:
              raise SystemExit('runtime score audit marker missing')
          p.write_text(s.replace(old, new, 1))

          p = Path('scripts/test.mjs')
          s = p.read_text()
          old = "assert.equal(validateScoreContract(candidateScore, 0.041, { weightedEV: 0.052, robustEV: 0.043, flipProbability: 0.12, quality: 0.85, modelErrorFloor: 0.025, independentEvidence: 0.65 }).ok, true);"
          new = "assert.equal(validateScoreContract(candidateScore, 0.041, { weightedEV: 0.052, robustEV: 0.043, flipProbability: 0.12, quality: 0.85, edgeStrength: 0.55, stability: 0.80, modelErrorFloor: 0.025, independentEvidence: 0.65, divergenceRisk: 0.05 }).ok, true);"
          if old not in s:
              raise SystemExit('candidate score parity test marker missing')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Run score parity, unit, security and Production build
        run: npm run build
      - name: Commit verified release
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/apply-score-distribution-v8-3.yml scripts/apply-score-distribution-v8-3.py
          git add -A
          git commit -m 'Release continuous GPT score distribution and anti-clustering validation v8.3.0 [verified]'
          git push origin HEAD:fix/score-distribution-v8-3-0
