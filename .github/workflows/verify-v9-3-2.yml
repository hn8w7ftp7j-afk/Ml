name: Verify v9.3.2 game isolation

on:
  push:
    branches: [fix/input-hash-game-isolation-tbd-v9-3-2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund --package-lock=false
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start local Production server
        run: |
          npm start > /tmp/mlb-v932.log 2>&1 &
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:3000/api/health >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/mlb-v932.log
          exit 1
      - name: Verify version and mobile page
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';
          const health = await (await fetch('http://127.0.0.1:3000/api/health')).json();
          assert.equal(health.ok, true);
          assert.equal(health.version, '9.3.2');
          assert.match(health.analysisCacheVersion, /GAME-CONTRACT/);
          assert.equal(health.deterministicScoring, true);
          assert.equal(health.gptScoringEnabled, false);

          const browser = await chromium.launch({ headless:true });
          const context = await browser.newContext({ viewport:{ width:390, height:844 }, isMobile:true, hasTouch:true });
          const page = await context.newPage();
          const pageErrors = [];
          const consoleErrors = [];
          page.on('pageerror', error => pageErrors.push(error.stack || error.message));
          page.on('console', message => { if (message.type() === 'error') consoleErrors.push(message.text()); });
          const response = await page.goto('http://127.0.0.1:3000', { waitUntil:'networkidle', timeout:120000 });
          assert.equal(response?.status(), 200);
          await page.getByRole('button', { name:'一鍵分析今日 MLB' }).waitFor();
          const body = await page.locator('body').innerText();
          assert.match(body, /v9\.3\.2/);
          assert.doesNotMatch(body, /Application error|client-side exception/i);
          assert.deepEqual(pageErrors, []);
          assert.deepEqual(consoleErrors, []);
          await browser.close();
          console.log(JSON.stringify({ ok:true, version:health.version, analysisCacheVersion:health.analysisCacheVersion }, null, 2));
          NODE
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/mlb-v932.log || true
