name: Apply vision discovery v8.2.1
on:
  push:
    branches: [fix/vision-discovery-v8-2-1]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apply-vision-discovery-v8-2-1
  cancel-in-progress: false
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply v8.2.1 discovery fix
        run: python scripts/apply-vision-discovery-v8-2-1.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Run scoring parity, unit, security and Production build
        run: npm run build
      - name: Commit verified v8.2.1 release
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/apply-vision-discovery-v8-2-1.yml scripts/apply-vision-discovery-v8-2-1.py
          git add -A
          git commit -m 'Fix independent dense-board discovery compatibility v8.2.1 [verified]'
          git push origin HEAD:fix/vision-discovery-v8-2-1
