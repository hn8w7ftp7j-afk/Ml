name: Verify v9.3 odds and credit integration

on:
  push:
    branches: [feature/odds-fix-tai888-credit-v9-3]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund --package-lock=false
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start local production server
        run: |
          npm start > /tmp/mlb-v93.log 2>&1 &
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:3000/api/health >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/mlb-v93.log
          exit 1
      - name: Verify one-click reference plus automatic actual credit flow
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';

          const game = {
            gamePk: 123456,
            gameDate: '2026-08-12T02:10:00Z',
            officialDate: '2026-08-11',
            status: '賽前', statusEnglish: 'Preview', statusCode: 'P',
            gameNumber: 1, scheduledInnings: 9,
            away: '波士頓紅襪', home: '多倫多藍鳥',
            awayEnglish: 'Boston Red Sox', homeEnglish: 'Toronto Blue Jays',
            awayTeamId: 111, homeTeamId: 141,
            awayProbable: '客隊先發', homeProbable: '主隊先發',
          };
          const referenceMarkets = [
            { market:'全場讓分', pick:'波士頓紅襪受讓1+50', water:0.82, rawDecimalOdds:1.82, sourceType:'INTERNATIONAL', lineAsOf:'2026-08-11T05:00:00Z', executable:false },
            { market:'全場讓分', pick:'多倫多藍鳥讓1+50', water:0.78, rawDecimalOdds:1.78, sourceType:'INTERNATIONAL', lineAsOf:'2026-08-11T05:00:00Z', executable:false },
          ];
          const actualMarkets = [
            { market:'全場讓分', pick:'波士頓紅襪受讓2-80', water:0.95, sourceType:'ACTUAL_TW_CREDIT', lineAsOf:'2026-08-11T05:01:00Z', executable:true },
            { market:'全場讓分', pick:'多倫多藍鳥讓2-80', water:0.95, sourceType:'ACTUAL_TW_CREDIT', lineAsOf:'2026-08-11T05:01:00Z', executable:true },
          ];
          const referenceResults = referenceMarkets.map((row, index) => ({ ...row, score:index ? 6.6 : 7.5, weightedEV:index ? -0.02 : 0.025, robustEV:index ? -0.04 : 0.012, tag:index ? 'PASS' : '正常下注', betEligible:false, qaSummary:{ passed:true } }));
          const actualResults = actualMarkets.map((row, index) => ({ ...row, score:index ? 6.6 : 7.7, weightedEV:index ? -0.03 : 0.034, robustEV:index ? -0.05 : 0.016, tag:index ? 'PASS' : '正常下注', betEligible:!index, qaSummary:{ passed:true } }));
          const snapshot = { frozenContext:{ game }, coreFingerprint:'core-v93', priceFingerprint:'price-ref', inputHash:'input-ref', distributionId:'distribution-v93', distributionHash:'dist-v93', dataAsOf:'2026-08-11T05:00:00Z', distributionSnapshot:{ distributionId:'distribution-v93', distributionHash:'dist-v93', simulationsPerScenario:500 } };
          const json = (route, payload, status = 200) => route.fulfill({ status, contentType:'application/json', body:JSON.stringify(payload) });

          const browser = await chromium.launch({ headless:true });
          const context = await browser.newContext({ viewport:{ width:390, height:844 }, isMobile:true, hasTouch:true });
          const page = await context.newPage();
          const pageErrors = [];
          const consoleErrors = [];
          page.on('pageerror', error => pageErrors.push(error.stack || error.message));
          page.on('console', message => { if (message.type() === 'error') consoleErrors.push(message.text()); });

          await page.route('**/api/**', async route => {
            const request = route.request();
            const url = new URL(request.url());
            if (url.pathname === '/api/health') return json(route, { ok:true, version:'9.3.0' });
            if (url.pathname === '/api/reference-lines' && request.method() === 'GET') return json(route, { ok:true, configured:true, primary:'THE_ODDS_API_CONSENSUS' });
            if (url.pathname === '/api/credit-lines' && request.method() === 'GET') return json(route, { ok:true, configured:true, provider:'TAI888_READ_ONLY_CREDIT', label:'Tai888唯讀信用盤' });
            if (url.pathname === '/api/mlb') return json(route, { ok:true, games:[game] });
            if (url.pathname === '/api/reference-lines' && request.method() === 'POST') return json(route, { ok:true, configured:true, provider:'THE_ODDS_API_CONSENSUS', games:[{ gamePk:game.gamePk, game, source:{ label:'國際市場參考盤｜The Odds API', observedAt:'2026-08-11T05:00:00Z' }, markets:referenceMarkets }], failures:[] });
            if (url.pathname === '/api/credit-lines' && request.method() === 'POST') return json(route, { ok:true, configured:true, provider:'TAI888_READ_ONLY_CREDIT', label:'Tai888唯讀信用盤', games:[{ gamePk:game.gamePk, game, source:{ label:'Tai888唯讀信用盤', observedAt:'2026-08-11T05:01:00Z' }, markets:actualMarkets }], warnings:[] });
            if (url.pathname === '/api/analyze') return json(route, { ok:true, game, context:{ game }, analysis:{ analysisType:'FULL', scoreFormulaVersion:'DUAL-EV-BOTTLENECK-2026-08-v1.0.0', distributionHash:'dist-v93', analysisStatus:'聯合情境版', results:referenceResults }, repriceSnapshot:snapshot, openMarkets:['全場讓分'] });
            if (url.pathname === '/api/reprice') {
              const body = request.postDataJSON();
              assert.ok(body.markets.some(row => row.sourceType === 'ACTUAL_TW_CREDIT'));
              return json(route, { ok:true, game, context:{ game }, analysis:{ analysisType:'PRICE_ONLY_REPRICE', scoreFormulaVersion:'DUAL-EV-BOTTLENECK-2026-08-v1.0.0', distributionHash:'dist-v93', analysisStatus:'凍結分布快速重算', results:actualResults }, repriceSnapshot:{ ...snapshot, priceFingerprint:'price-actual', inputHash:'input-actual' }, reprice:{ noCoreDataFetch:true, noSimulation:true, noGpt:true } });
            }
            return json(route, { ok:false, error:`unmocked ${url.pathname}` }, 404);
          });

          const response = await page.goto('http://127.0.0.1:3000', { waitUntil:'networkidle', timeout:120000 });
          assert.equal(response?.status(), 200);
          await page.getByRole('button', { name:'一鍵分析今日 MLB' }).click();
          await page.getByText('Tai888唯讀信用盤', { exact:true }).first().waitFor({ timeout:30000 });
          await page.getByText('我的實際信用盤', { exact:true }).waitFor();
          await page.getByText('波士頓紅襪受讓2-80', { exact:true }).waitFor();
          await page.locator('.score', { hasText:'7.7' }).waitFor();
          const body = await page.locator('body').innerText();
          assert.match(body, /國際市場參考盤/);
          assert.doesNotMatch(body, /Application error|client-side exception/i);
          assert.deepEqual(pageErrors, []);
          assert.deepEqual(consoleErrors, []);
          console.log(JSON.stringify({ ok:true, pageErrors, consoleErrors, body:body.slice(0,1200) }, null, 2));
          await browser.close();
          NODE
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/mlb-v93.log || true
