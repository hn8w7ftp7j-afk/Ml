name: Apply GPT alignment v7

on:
  push:
    branches:
      - feature/gpt-alignment-v7
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-gpt-alignment-v7
  cancel-in-progress: false

jobs:
  patch-test-build:
    if: ${{ !contains(github.event.head_commit.message || '', '[gpt alignment applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Repair patch marker for current MLB source
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-gpt-alignment-v7.py')
          text = path.read_text()
          old = "      innings: safe(pitching.inningsPitched, 0),\\n    };"
          new = "      innings: Number.parseFloat(pitching.inningsPitched || 0) || 0,\\n    };"
          if old not in text:
              raise SystemExit('reliever marker repair target missing')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Apply GPT alignment v7 patch
        run: python scripts/apply-gpt-alignment-v7.py
      - name: Preserve conservative divergence controls
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/analysis.js')
          text = path.read_text()
          old_score = "      if (calibration.divergenceRisk > 0.18) score = Math.min(score, 7.4);\n      else if (calibration.divergenceRisk > 0.12) score = Math.min(score, 7.9);"
          new_score = "      if (calibration.rawProbabilityGap > 0.18 || calibration.divergenceRisk > 0.18) score = Math.min(score, 7.4);\n      else if (calibration.rawProbabilityGap > 0.12 || calibration.divergenceRisk > 0.12) score = Math.min(score, 7.9);"
          old_unit = "      if (calibration.divergenceRisk > 0.12) units = Math.min(units, 0.5);"
          new_unit = "      if (calibration.rawProbabilityGap > 0.12 || calibration.divergenceRisk > 0.12) units = Math.min(units, 0.5);"
          if old_score not in text or old_unit not in text:
              raise SystemExit('divergence control target missing')
          text = text.replace(old_score, new_score, 1).replace(old_unit, new_unit, 1)
          path.write_text(text)
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Run unit, security and production build checks
        run: npm run build
      - name: Commit verified GPT alignment v7
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEPLOYMENT_VERSION README.md package.json \
            app/page.js app/globals.css app/api/analyze/route.js app/api/health/route.js \
            lib/analysis.js lib/markets.js lib/mlb.js lib/expert.js \
            scripts/test.mjs scripts/smoke.mjs
          git rm .github/workflows/apply-gpt-alignment-v7.yml
          git rm -f scripts/apply-gpt-alignment-v7.py
          git commit -m 'Integrate GPT research layer and alignment audit v7 [gpt alignment applied]'
          git push origin HEAD:feature/gpt-alignment-v7
