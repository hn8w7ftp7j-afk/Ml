name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: node scripts/score-model-integrity-v102-test.mjs
      - run: npm test
      - run: npm run build
      - run: node scripts/package-reader.mjs release
