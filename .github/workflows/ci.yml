name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply v10.2 score-model repair
        if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[v102-score-model-applied]') }}
        run: node scripts/apply-v102-score-model-fix.mjs
      - name: v10.2 targeted integrity regression
        if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[v102-score-model-applied]') }}
        run: node scripts/score-model-integrity-v102-test.mjs
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
      - run: node scripts/package-reader.mjs release
      - name: Commit verified v10.2 repairs
        if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[v102-score-model-applied]') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/mlb-context-v11.js lib/joint-score-v11.js lib/joint-score-v12.js lib/analysis-v11.js lib/deterministic-finalizer-v10.js app/page.js scripts/score-model-integrity-v102-test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix: apply v10.2 score model integrity repairs [v102-score-model-applied]"
          git push origin HEAD:main

