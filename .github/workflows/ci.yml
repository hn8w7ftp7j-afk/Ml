name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  settlement-database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: integration-test-only
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify append-only settlement recovery in PostgreSQL
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          cat database/tests/settlement-review-fixture.sql database/0010_analysis_direction_review_recovery.sql database/tests/settlement-review-assertions.sql | docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: node scripts/score-model-integrity-v102-test.mjs
      - run: npm run test:external-audit
      - run: npm test
      - run: npm run build
      - run: node scripts/package-reader.mjs release
