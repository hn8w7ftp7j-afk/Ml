name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  settlement-database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: integration-test-only
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify append-only settlement recovery in PostgreSQL
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          cat database/tests/settlement-review-fixture.sql database/0010_analysis_direction_review_recovery.sql database/tests/settlement-review-assertions.sql | docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify concurrent history schema initialization
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" createdb -U postgres schema_concurrency_test
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -d schema_concurrency_test -v ON_ERROR_STOP=1 < database/0005_analysis_pit_snapshots.sql
          node scripts/direction-schema-concurrency-test.mjs --sql > /tmp/direction-schema.sql
          pids=()
          for worker in $(seq 1 8); do
            docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -d schema_concurrency_test -v ON_ERROR_STOP=1 < /tmp/direction-schema.sql > "/tmp/schema-worker-$worker.log" 2>&1 &
            pids+=("$!")
          done
          result=0
          for pid in "${pids[@]}"; do wait "$pid" || result=1; done
          cat /tmp/schema-worker-*.log
          exit "$result"
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test:push
      - run: node scripts/score-model-integrity-v102-test.mjs
      - run: npm run test:pit-audit
      - run: npm run test:asian-evidence
      - run: npm run test:external-audit
      - run: npm run test:evidence-completion
      - run: node --experimental-loader=./scripts/next-route-test-loader.mjs scripts/pit-history-export-test.mjs
      - run: npm test
      - run: npm run build
      - run: node scripts/package-reader.mjs release
