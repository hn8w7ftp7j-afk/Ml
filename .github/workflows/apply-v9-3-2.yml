name: Apply v9.3.2 isolation and TBD modeling

on:
  push:
    branches: [fix/input-hash-game-isolation-tbd-v9-3-2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/input-hash-game-isolation-tbd-v9-3-2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/apply-v9-3-2.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/mlb.js package.json app/api/health/route.js app/page.js DEPLOYMENT_VERSION
          git diff --cached --quiet && exit 0
          git commit -m "Fix analysis cache isolation and model TBD starters"
          git push origin HEAD:fix/input-hash-game-isolation-tbd-v9-3-2
