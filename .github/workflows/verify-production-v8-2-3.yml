name: Verify Production v8.2.3
on:
  push:
    branches: [verify/production-v8-2-3]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-production-v8-2-3
  cancel-in-progress: true
jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --no-audit --no-fund --package-lock=false
      - name: Wait for exact Production v8.2.3
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 30); do
            if curl -fsS --connect-timeout 10 --max-time 30 "https://mlb-positive-ev.vercel.app/api/health?t=$(date +%s)" -o /tmp/health.json; then
              cat /tmp/health.json
              if node - <<'NODE'
          const x=require('/tmp/health.json');
          process.exit(x.ok===true&&x.version==='8.2.3'&&x.commit==='4fbfaca0dfa0c638f39de66532ab4ebb197a638a'&&x.visionVersion==='MLB-VISION-2026-08-v8.2.3'&&x.scoreContractVersion==='GPT-COMPOSITE-EVIDENCE-v8.2'?0:1);
          NODE
              then ok=1; break; fi
            fi
            sleep 5
          done
          test "$ok" = 1
      - name: Log exact dense-board output
        run: node scripts/debug-live-vision-v8-2-3.mjs
      - name: Run full live smoke
        run: env -u GITHUB_SHA SMOKE_URL=https://mlb-positive-ev.vercel.app node scripts/smoke.mjs
