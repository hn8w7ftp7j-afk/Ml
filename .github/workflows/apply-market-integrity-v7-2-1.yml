name: Apply market integrity v7.2.1
on:
  push:
    branches: [fix/market-integrity-v7-2-1]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: python scripts/apply-market-integrity-v7-2-1.py
      - name: Update smoke version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/smoke.mjs'); s=p.read_text().replace("const VERSION = '7.2.0';","const VERSION = '7.2.1';").replace('/第\\s*7\\.2\\.0\\s*版/','/第\\s*7\\.2\\.1\\s*版/'); p.write_text(s)
          PY
      - run: npm install --no-audit --no-fund --package-lock=false
      - run: npm run build
      - name: Commit verified repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEPLOYMENT_VERSION README.md package.json app/page.js app/api/health/route.js lib/markets.js scripts/test.mjs scripts/smoke.mjs
          git rm .github/workflows/apply-market-integrity-v7-2-1.yml scripts/apply-market-integrity-v7-2-1.py
          git commit -m 'Block implausible MLB market lines v7.2.1 [market integrity applied]'
          git push origin HEAD:fix/market-integrity-v7-2-1
