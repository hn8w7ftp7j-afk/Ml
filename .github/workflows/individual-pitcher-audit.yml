name: Individual pitcher endpoint audit

on:
  push:
    branches: [audit/v1011-live-score-model]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/mlb-individual-pitchers-audit.mjs
