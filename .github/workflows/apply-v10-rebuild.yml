name: Apply V10 rebuild

on:
  push:
    branches: [agent/v10-model-rebuild]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v10-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v10-model-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply integration patch
        run: node scripts/apply-v10-rebuild.mjs
      - name: Commit generated integration changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app lib scripts package.json DEPLOYMENT_VERSION
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "feat: integrate V10 point-in-time raw EV shadow scores [v10-applied]"
            git push origin HEAD:agent/v10-model-rebuild
          fi
