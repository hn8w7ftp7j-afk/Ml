name: Apply efficient vision v8.2.2
on:
  push:
    branches: [fix/efficient-vision-score-cache-v8-2-2]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apply-efficient-vision-v8-2-2
  cancel-in-progress: false
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply v8.2.2 efficient vision patch
        run: python scripts/apply-efficient-vision-v8-2-2.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Run scoring parity, unit, security and Production build
        run: npm run build
      - name: Commit verified v8.2.2 release
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/apply-efficient-vision-v8-2-2.yml scripts/apply-efficient-vision-v8-2-2.py
          git add -A
          git commit -m 'Release efficient one-pass vision and score snapshot validation v8.2.2 [verified]'
          git push origin HEAD:fix/efficient-vision-score-cache-v8-2-2
