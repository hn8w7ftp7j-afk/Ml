name: Verify Tai888 Production source

on:
  push:
    branches: [verify/tai888-production-live]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-tai888:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify deployed environment and Tai888 login/board
        env:
          BASE: https://mlb-positive-ev.vercel.app
          EXPECTED_COMMIT: 3e1893fd9b2ea5a996e016ffbe7eff16ba70a5be
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';

          const BASE = process.env.BASE;
          const parse = async (response) => {
            const text = await response.text();
            try { return JSON.parse(text); }
            catch { throw new Error(`${response.status}: ${text.slice(0, 1000)}`); }
          };
          const taipeiDate = (offset = 0) => new Intl.DateTimeFormat('en-CA', {
            timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit',
          }).format(new Date(Date.now() + offset * 86400000));
          const postHeaders = () => ({
            'Content-Type': 'application/json',
            Origin: BASE,
            Referer: `${BASE}/`,
            'Idempotency-Key': crypto.randomUUID(),
          });

          const healthResponse = await fetch(`${BASE}/api/health?t=${Date.now()}`, {
            cache: 'no-store', signal: AbortSignal.timeout(30000),
          });
          const health = await parse(healthResponse);
          assert.equal(healthResponse.status, 200, JSON.stringify(health));
          assert.equal(health.ok, true);
          assert.equal(health.commit, process.env.EXPECTED_COMMIT, `Production commit mismatch: ${health.commit}`);
          assert.equal(health.creditLinesConfigured, true, 'Tai888 environment variables are not active in Production');
          assert.equal(health.creditLinesProvider, 'TAI888_READ_ONLY_CREDIT');

          const statusResponse = await fetch(`${BASE}/api/credit-lines?t=${Date.now()}`, {
            cache: 'no-store', signal: AbortSignal.timeout(30000),
          });
          const status = await parse(statusResponse);
          assert.equal(statusResponse.status, 200, JSON.stringify(status));
          assert.equal(status.ok, true);
          assert.equal(status.configured, true, 'Tai888 source reports configured=false');

          let selected = null;
          for (const offset of [0, -1, 1]) {
            const date = taipeiDate(offset);
            const response = await fetch(`${BASE}/api/mlb?date=${date}&t=${Date.now()}`, {
              cache: 'no-store', signal: AbortSignal.timeout(60000),
            });
            const data = await parse(response);
            if (response.ok && Array.isArray(data.games) && data.games.length && (!selected || data.games.length > selected.games.length)) {
              selected = { date, games: data.games };
            }
          }
          assert.ok(selected, 'No MLB schedule available for Tai888 matching test');

          const boardResponse = await fetch(`${BASE}/api/credit-lines`, {
            method: 'POST',
            headers: postHeaders(),
            body: JSON.stringify({ date: selected.date, schedule: selected.games }),
            signal: AbortSignal.timeout(150000),
          });
          const board = await parse(boardResponse);
          assert.equal(boardResponse.status, 200, JSON.stringify(board).slice(0, 3000));
          assert.equal(board.ok, true, JSON.stringify(board).slice(0, 3000));
          assert.equal(board.configured, true);
          assert.equal(board.provider, 'TAI888_READ_ONLY_CREDIT');
          assert.ok(board.diagnostics && Number(board.diagnostics.pages) >= 1, 'Tai888 login did not return readable authenticated pages');
          assert.ok(board.parserModel, 'Tai888 page was not parsed by the server-side parser');
          assert.ok(Array.isArray(board.games), 'Tai888 games payload is missing');

          console.log(JSON.stringify({
            ok: true,
            production: {
              version: health.version,
              commit: health.commit,
              creditLinesConfigured: health.creditLinesConfigured,
              provider: health.creditLinesProvider,
            },
            tai888: {
              date: selected.date,
              officialScheduleGames: selected.games.length,
              matchedCreditGames: board.games.length,
              parserModel: board.parserModel,
              diagnostics: board.diagnostics,
              warnings: Array.isArray(board.warnings) ? board.warnings.slice(0, 8) : [],
              cache: board.cache,
            },
          }, null, 2));
          NODE
