name: Apply vision v7.0.5 repair

on:
  push:
    branches:
      - fix/vision-base64-v7-0-5
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-vision-v7-0-5
  cancel-in-progress: false

jobs:
  patch-test-build:
    if: ${{ !contains(github.event.head_commit.message || '', '[vision v7.0.5 applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply vision v7.0.5 patch
        run: python scripts/apply-vision-v7-0-5.py
      - name: Validate synthetic fixture Base64
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re
          value = re.sub(r'\s+', '', Path('scripts/fixtures/vision-table.b64').read_text())
          data = base64.b64decode(value, validate=True)
          assert data.startswith(b'\x89PNG\r\n\x1a\n')
          print(f'valid PNG fixture: {len(data)} bytes')
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Run unit, security and production build checks
        run: npm run build
      - name: Commit verified Base64 repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEPLOYMENT_VERSION README.md package.json \
            app/page.js app/api/health/route.js app/api/vision/route.js \
            lib/vision.js scripts/test.mjs scripts/smoke.mjs
          git rm .github/workflows/apply-vision-v7-0-5.yml scripts/apply-vision-v7-0-5.py
          git commit -m 'Normalize Base64 image data before vision calls v7.0.5 [vision v7.0.5 applied]'
          git push origin HEAD:fix/vision-base64-v7-0-5
