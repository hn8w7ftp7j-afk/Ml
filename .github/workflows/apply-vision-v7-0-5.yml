name: Apply vision v7.0.5 repair

on:
  push:
    branches:
      - fix/vision-base64-v7-0-5
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-vision-v7-0-5
  cancel-in-progress: false

jobs:
  patch-test-build:
    if: ${{ !contains(github.event.head_commit.message || '', '[vision v7.0.5 applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply vision v7.0.5 patch
        run: python scripts/apply-vision-v7-0-5.py
      - name: Generate and validate a clear synthetic credit-board PNG
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import base64, io

          width, height = 1800, 1040
          image = Image.new('RGB', (width, height), 'white')
          draw = ImageDraw.Draw(image)
          bold_path = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          regular_path = '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          title = ImageFont.truetype(bold_path, 52)
          header = ImageFont.truetype(bold_path, 38)
          body = ImageFont.truetype(regular_path, 34)
          body_bold = ImageFont.truetype(bold_path, 34)

          draw.rectangle((35, 35, width - 35, height - 35), outline='black', width=5)
          draw.text((80, 75), 'MLB TAIWAN CREDIT BOARD', font=title, fill='black')
          draw.text((80, 155), 'CLEVELAND GUARDIANS @ CHICAGO WHITE SOX', font=header, fill='black')

          rows = [
              ('FULL GAME RUN LINE', True),
              ('CLEVELAND GUARDIANS  FAVORITE  1+15   WATER 0.950', False),
              ('CHICAGO WHITE SOX    UNDERDOG  1+15   WATER 0.950', False),
              ('FULL GAME TOTAL', True),
              ('OVER   8+50   WATER 0.940', False),
              ('UNDER  8+50   WATER 0.940', False),
              ('FIRST 5 RUN LINE', True),
              ('CLEVELAND GUARDIANS  FAVORITE  0+50   WATER 0.940', False),
              ('CHICAGO WHITE SOX    UNDERDOG  0+50   WATER 0.940', False),
              ('FIRST 5 TOTAL', True),
              ('OVER   4+20   WATER 0.930    |    UNDER  4+20   WATER 0.930', False),
          ]
          y = 245
          for text, is_header in rows:
              if is_header:
                  draw.rectangle((65, y - 12, width - 65, y + 53), fill=(225, 232, 240), outline='black', width=2)
                  draw.text((90, y), text, font=header, fill='black')
                  y += 78
              else:
                  draw.text((100, y), text, font=body_bold if 'WATER' in text else body, fill='black')
                  y += 63

          buffer = io.BytesIO()
          image.save(buffer, format='PNG', optimize=True)
          data = buffer.getvalue()
          encoded = base64.b64encode(data).decode('ascii')
          decoded = base64.b64decode(encoded, validate=True)
          assert decoded == data and decoded.startswith(b'\x89PNG\r\n\x1a\n')
          Path('scripts/fixtures/vision-table.b64').write_text(encoded + '\n')
          print(f'valid PNG fixture: {width}x{height}, {len(data)} bytes, {len(encoded)} base64 chars')
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Run unit, security and production build checks
        run: npm run build
      - name: Commit verified Base64 repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEPLOYMENT_VERSION README.md package.json \
            app/page.js app/api/health/route.js app/api/vision/route.js \
            lib/vision.js scripts/test.mjs scripts/smoke.mjs scripts/fixtures/vision-table.b64
          git rm .github/workflows/apply-vision-v7-0-5.yml scripts/apply-vision-v7-0-5.py
          git commit -m 'Normalize Base64 image data before vision calls v7.0.5 [vision v7.0.5 applied]'
          git push origin HEAD:fix/vision-base64-v7-0-5
