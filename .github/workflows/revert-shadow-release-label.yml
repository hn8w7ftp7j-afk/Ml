name: Restore shadow release label

on:
  push:
    branches: [agent/v10-full-joint-model-rebuild]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[shadow-label-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v10-full-joint-model-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/revert-shadow-release-label.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/deterministic-finalizer-v10.js scripts/analysis-v10-test.mjs
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: keep shadow release label compatibility [shadow-label-applied]"
            git push origin HEAD:agent/v10-full-joint-model-rebuild
          fi
