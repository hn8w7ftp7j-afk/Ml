name: Verify Production v8.2.1
on:
  push:
    branches: [verify/production-v8-2-1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-production-v8-2-1
  cancel-in-progress: true
jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Wait for exact Production v8.2.1 deployment
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 30); do
            if curl -fsS --connect-timeout 10 --max-time 30 "https://mlb-positive-ev.vercel.app/api/health?t=$(date +%s)" -o /tmp/health.json; then
              cat /tmp/health.json
              if node - <<'NODE'
          const value = require('/tmp/health.json');
          const passed = value.ok === true
            && value.version === '8.2.1'
            && value.commit === '1ad68cc53669ab4be3ddd8a946637ea028bf63a6'
            && value.modelVersion === 'GPT完整指令聯合情境模型-2026-08-v8.2.0'
            && value.rulesVersion === 'MLB-TW-EXECUTION-2026-08-v8.2.0'
            && value.visionVersion === 'MLB-VISION-2026-08-v8.2.1'
            && value.scoreContractVersion === 'GPT-COMPOSITE-EVIDENCE-v8.2'
            && value.aiGatewayConfigured === true;
          process.exit(passed ? 0 : 1);
          NODE
              then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          test "$ok" = 1
      - name: Log exact live dense-board vision result
        run: node scripts/debug-live-vision-v8-2-1.mjs
      - name: Run complete live Production smoke
        run: env -u GITHUB_SHA SMOKE_URL=https://mlb-positive-ev.vercel.app node scripts/smoke.mjs
