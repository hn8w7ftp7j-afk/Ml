name: Apply v10.2.3 final score integration

on:
  push:
    branches: [fix/v1023-final-score-integration]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-v1023-final-score-integration
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[v1023-final-score-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1023-final-score-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-v1023-final-score-integration.mjs
      - run: node scripts/score-model-integrity-v102-test.mjs
      - run: node scripts/shadow-score-visibility-v102-test.mjs
      - run: node scripts/page-reader-automation-v941-test.mjs
      - run: npm test
      - run: npm run build
      - name: Commit verified integration
        run: |
          rm scripts/apply-v1023-final-score-integration.mjs
          rm .github/workflows/apply-v1023-final-score-integration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: integrate fixed S-score website semantics [v1023-final-score-applied]"
          git push origin HEAD:fix/v1023-final-score-integration
