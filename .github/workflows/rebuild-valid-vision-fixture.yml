name: Rebuild valid vision fixture

on:
  push:
    branches:
      - fix/valid-vision-smoke-fixture
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-valid-vision-fixture
  cancel-in-progress: false

jobs:
  rebuild-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install fixture image dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Generate a real valid JPEG fixture
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          import base64

          width, height = 1500, 900
          image = Image.new('RGB', (width, height), 'white')
          draw = ImageDraw.Draw(image)
          regular = '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          bold = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          title = ImageFont.truetype(bold, 48)
          heading = ImageFont.truetype(bold, 31)
          body = ImageFont.truetype(regular, 29)
          small = ImageFont.truetype(regular, 22)

          navy = (18, 47, 79)
          grid = (122, 138, 153)
          light = (239, 243, 247)
          red = (178, 43, 43)
          blue = (32, 82, 150)
          black = (20, 25, 30)

          draw.rectangle((0, 0, width, 85), fill=navy)
          draw.text((42, 15), 'MLB TAIWAN CREDIT BOARD', font=title, fill='white')
          draw.text((42, 105), 'CLEVELAND GUARDIANS  @  CHICAGO WHITE SOX', font=heading, fill=black)

          left, top, right = 42, 170, width - 42
          columns = [0, 260, 835, 1070, 1260, right - left]
          headers = ['MARKET', 'PICK', 'LINE', 'WATER', 'STATUS']
          draw.rectangle((left, top, right, top + 62), fill=(208, 219, 232))
          for index, label in enumerate(headers):
              draw.text((left + columns[index] + 12, top + 12), label, font=heading, fill=navy)

          rows = [
              ('FULL RUNLINE', 'CLEVELAND GUARDIANS FAVORITE', '1+15', '0.950', 'OPEN'),
              ('FULL RUNLINE', 'CHICAGO WHITE SOX UNDERDOG', '1+15', '0.950', 'OPEN'),
              ('FULL TOTAL', 'OVER', '8+50', '0.940', 'OPEN'),
              ('FULL TOTAL', 'UNDER', '8+50', '0.940', 'OPEN'),
              ('FIRST 5 RUNLINE', 'CLEVELAND GUARDIANS FAVORITE', '0+50', '0.940', 'OPEN'),
              ('FIRST 5 RUNLINE', 'CHICAGO WHITE SOX UNDERDOG', '0+50', '0.940', 'OPEN'),
              ('FIRST 5 TOTAL', 'OVER', '4+20', '0.930', 'OPEN'),
              ('FIRST 5 TOTAL', 'UNDER', '4+20', '0.930', 'OPEN'),
          ]
          row_height = 76
          for x in [left + value for value in columns]:
              draw.line((x, top, x, top + 62 + row_height * len(rows)), fill=grid, width=2)
          draw.line((right, top, right, top + 62 + row_height * len(rows)), fill=grid, width=2)

          for row_index, row in enumerate(rows):
              y = top + 62 + row_index * row_height
              if row_index % 2 == 0:
                  draw.rectangle((left, y, right, y + row_height), fill=light)
              draw.line((left, y, right, y), fill=grid, width=2)
              for column_index, value in enumerate(row):
                  color = black
                  if column_index == 1:
                      color = blue if ('CLEVELAND' in value or value == 'OVER') else red
                  if column_index == 3:
                      color = red
                  draw.text((left + columns[column_index] + 12, y + 20), value, font=body, fill=color)
          bottom = top + 62 + row_height * len(rows)
          draw.line((left, bottom, right, bottom), fill=grid, width=2)
          draw.text((42, 835), 'VISIBLE MARKET DATA ONLY - NO BETTING RECOMMENDATION', font=small, fill=(90, 90, 90))

          output = Path('/tmp/vision-table.jpg')
          image.save(output, format='JPEG', quality=82, optimize=True, subsampling=2)
          encoded = base64.b64encode(output.read_bytes()).decode('ascii')
          assert encoded.startswith('/9j/') and '\n' not in encoded and '\r' not in encoded
          Path('scripts/fixtures/vision-table.b64').write_text(encoded + '\n')
          print(f'fixture bytes={output.stat().st_size}, base64={len(encoded)}')
          PY
      - name: Validate fixture bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          raw = ''.join(Path('scripts/fixtures/vision-table.b64').read_text().split())
          decoded = base64.b64decode(raw, validate=True)
          assert decoded[:3] == b'\xff\xd8\xff'
          assert decoded[-2:] == b'\xff\xd9'
          print(f'valid JPEG fixture: {len(decoded)} bytes')
          PY
      - name: Install application dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Run unit, security and production build checks
        run: npm run build
      - name: Commit valid fixture
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/fixtures/vision-table.b64
          git rm .github/workflows/rebuild-valid-vision-fixture.yml
          git commit -m 'Replace corrupted vision smoke fixture with valid JPEG [fixture rebuilt]'
          git push origin HEAD:fix/valid-vision-smoke-fixture
