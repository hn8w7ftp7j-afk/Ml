name: Apply vision completeness v7.3
on:
  push:
    branches: [fix/vision-completeness-v7-3]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: python scripts/apply-vision-completeness-v7-3.py
      - name: Sync tests and smoke versions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/smoke.mjs'); s=p.read_text().replace("const VERSION = '7.2.1';","const VERSION = '7.3.0';").replace("const VISION_VERSION = 'MLB-VISION-2026-08-v7.0.5';","const VISION_VERSION = 'MLB-VISION-2026-08-v7.3.0';").replace('/第\\s*7\\.2\\.1\\s*版/','/第\\s*7\\.3\\.0\\s*版/'); p.write_text(s)
          p=Path('scripts/test.mjs'); s=p.read_text().replace('assert.match(VISION_VERSION, /v7\\.0\\.5$/);','assert.match(VISION_VERSION, /v7\\.3\\.0$/);'); p.write_text(s)
          PY
      - run: npm install --no-audit --no-fund --package-lock=false
      - run: npm run build
      - name: Commit verified repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEPLOYMENT_VERSION README.md package.json app/page.js app/api/health/route.js app/api/vision/route.js lib/vision.js scripts/test.mjs scripts/smoke.mjs
          git rm .github/workflows/apply-vision-completeness-v7-3.yml scripts/apply-vision-completeness-v7-3.py
          git commit -m 'Scan every visible matchup before market extraction v7.3.0 [vision completeness applied]'
          git push origin HEAD:fix/vision-completeness-v7-3
