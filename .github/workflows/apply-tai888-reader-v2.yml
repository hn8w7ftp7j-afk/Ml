name: Apply and verify Tai888 Reader v2

on:
  push:
    branches: [feature/tai888-reader-v1]
    paths:
      - scripts/apply-tai888-reader-v2.mjs
      - .github/workflows/apply-tai888-reader-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tai888-reader-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply Reader v2 patch
        run: node scripts/apply-tai888-reader-v2.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Run permanent tests and Production build
        run: npm run build
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .env.example README.md DEPLOYMENT_VERSION middleware.js package.json app lib reader scripts
          git commit -m "Release v9.4.0 Tai888 Reader automatic sync" || exit 0
          git push origin HEAD:feature/tai888-reader-v1
