name: Verify Production v8.2.5
on:
  push:
    branches: [verify/production-v8-2-5]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --no-audit --no-fund --package-lock=false
      - name: Verify exact Production commit
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 30); do
            if curl -fsS --connect-timeout 10 --max-time 30 "https://mlb-positive-ev.vercel.app/api/health?t=$(date +%s)" -o /tmp/health.json; then
              cat /tmp/health.json
              if node - <<'NODE'
          const x=require('/tmp/health.json');
          process.exit(x.ok===true&&x.version==='8.2.5'&&x.commit==='104cec3427285ddbd08b8bc1a2747c6bd51eaad7'&&x.visionVersion==='MLB-VISION-2026-08-v8.2.5'&&x.scoreContractVersion==='GPT-COMPOSITE-EVIDENCE-v8.2'?0:1);
          NODE
              then ok=1; break; fi
            fi
            sleep 5
          done
          test "$ok" = 1
      - name: Run complete live Production smoke
        run: env -u GITHUB_SHA SMOKE_URL=https://mlb-positive-ev.vercel.app node scripts/smoke.mjs
