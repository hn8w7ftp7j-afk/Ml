name: Apply vision routing v8.2.4
on:
  push:
    branches: [fix/vision-model-routing-v8-2-4]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: python scripts/apply-vision-routing-v8-2-4.py
      - run: npm install --no-audit --no-fund --package-lock=false
      - run: npm run build
      - name: Commit verified release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/apply-vision-routing-v8-2-4.yml scripts/apply-vision-routing-v8-2-4.py
          git add -A
          git commit -m 'Route dense-board OCR through low-latency vision models v8.2.4 [verified]'
          git push origin HEAD:fix/vision-model-routing-v8-2-4
