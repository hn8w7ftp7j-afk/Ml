name: Model QA 2.0 diagnostic
on:
  push:
    branches: [feature/qa2-diagnostic-audit]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/model-qa-v2-test.mjs
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
