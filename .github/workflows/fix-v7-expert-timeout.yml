name: Fix v7 expert timeout

on:
  push:
    branches:
      - fix/v7-expert-timeout
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-v7-expert-timeout
  cancel-in-progress: false

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply v7.0.1 expert timeout repair
        run: python scripts/fix-v7-expert-timeout.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Run unit, security and production build checks
        run: npm run build
      - name: Commit verified repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEPLOYMENT_VERSION README.md package.json app/page.js app/api/analyze/route.js app/api/health/route.js lib/analysis.js lib/expert.js scripts/smoke.mjs
          git rm .github/workflows/fix-v7-expert-timeout.yml scripts/fix-v7-expert-timeout.py
          git commit -m 'Reserve fallback budget for GPT research layer v7.0.1 [expert timeout fixed]'
          git push origin HEAD:fix/v7-expert-timeout
