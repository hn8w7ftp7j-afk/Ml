name: Verify v9.3.3 complete input hash

on:
  push:
    branches: [fix/calculation-input-hash-v9-3-3]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund --package-lock=false
      - run: npm run build
      - name: Start local Production server
        run: |
          npm start > /tmp/mlb-v933.log 2>&1 &
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:3000/api/health >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/mlb-v933.log
          exit 1
      - name: Verify complete-input version
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const health = await (await fetch('http://127.0.0.1:3000/api/health')).json();
          assert.equal(health.ok, true);
          assert.equal(health.version, '9.3.3');
          assert.match(health.dataVersion, /v1\.2\.0/);
          assert.match(health.repriceVersion, /v1\.2\.0/);
          assert.match(health.analysisCacheVersion, /v2\.1\.0/);
          assert.equal(health.deterministicScoring, true);
          assert.equal(health.gptScoringEnabled, false);
          console.log(JSON.stringify({ ok:true, version:health.version, dataVersion:health.dataVersion, repriceVersion:health.repriceVersion, analysisCacheVersion:health.analysisCacheVersion }, null, 2));
          NODE
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/mlb-v933.log || true
