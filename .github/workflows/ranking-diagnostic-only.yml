name: Ranking diagnostic-only eligibility
on:
  push:
    branches: [fix/v1051-ranking-diagnostic-only]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-test:
    if: ${{ !contains(github.event.head_commit.message, '[ranking-diagnostic-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1051-ranking-diagnostic-only
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-ranking-diagnostic-only.mjs
      - name: Regression assertions
        run: |
          grep -q "row.formulaDiagnosticScore != null" app/page.js
          grep -q "診斷警告｜仍保留排名" app/page.js
          ! grep -q "row.evCalibration?.scenarioStable === true" app/page.js
          ! grep -q "Number(row.shadowDiagnosticScore) >= 7.2" app/page.js
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: keep diagnostic scores eligible for shadow ranking [ranking-diagnostic-applied]"
          git push origin HEAD:fix/v1051-ranking-diagnostic-only
