name: Final release gate MLB EV v9.4.1 Reader v2.0.2

on:
  push:
    branches: [fix/tai888-reader-v2-0-2-production]
    paths:
      - .github/workflows/release-v202-production-final.yml
      - scripts/run-v202-production-patch.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tai888-reader-v2-0-2-production
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply deterministic production patch
        run: |
          node scripts/run-v202-production-patch.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const extra = ['node scripts/tai888-reader-game-match-v202-test.mjs'];
          const existing = String(packageJson.scripts.test || '').split(' && ').filter(Boolean);
          packageJson.scripts.test = [...new Set([...existing, ...extra])].join(' && ');
          fs.writeFileSync('package.json', JSON.stringify(packageJson, null, 2) + '\n');
          NODE

      - name: Install runtime dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Run complete regression and Reader audit suite
        run: npm test

      - name: Audit production dependencies
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high

      - name: Build Next.js production application
        run: npx next build

      - name: Run local Pair → Ingest → Analyze → Reprice E2E
        env:
          APP_PASSWORD: local-app-password
          SESSION_SECRET: local-session-secret-with-high-entropy-123456789
          READER_PAIR_SECRET: local-reader-password
          READER_STORE_MEMORY_ONLY: 'true'
          NODE_ENV: production
        run: |
          set -euo pipefail
          npm start > /tmp/mlb-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true; cat /tmp/mlb-next.log || true' EXIT
          node scripts/local-reader-e2e-v202.mjs
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          trap - EXIT

      - name: Build and independently verify Reader ZIP
        run: |
          set -euo pipefail
          rm -rf dist stage verify
          mkdir -p stage/Tai888-Reader dist verify
          cp -a reader/. stage/Tai888-Reader/
          cat > stage/Tai888-Reader/INSTALL.txt <<'TXT'
          Tai888 Reader 2.0.2｜正式版

          1. 完整解壓縮本 ZIP。
          2. Chrome 開啟 chrome://extensions
          3. 開啟「開發人員模式」。
          4. 移除 Tai888 Reader 2.0.1 或更舊版本。
          5. 按「載入未封裝項目」。
          6. 選擇 Tai888-Reader 資料夾；該資料夾內必須直接看得到 manifest.json。
          7. 確認版本顯示 2.0.2。
          8. 回到 https://www1.tai888.in/newapp/#/BS 並按一次 F5。
          9. 停在「美棒 → 讓分＆大小」，開啟 Reader，配對並立即同步。

          長期運作：Windows 不睡眠、Chrome 開啟、Tai888 MLB 標準盤頁保持登入。
          TXT
          cd stage
          zip -r -9 ../dist/Tai888-Reader-v2.0.2.zip Tai888-Reader
          cd ..
          unzip -t dist/Tai888-Reader-v2.0.2.zip
          unzip -q dist/Tai888-Reader-v2.0.2.zip -d verify
          test -s verify/Tai888-Reader/manifest.json
          test -s verify/Tai888-Reader/capture-policy.js
          test -s verify/Tai888-Reader/row-normalizer.js
          test -s verify/Tai888-Reader/tai888-content.js
          test -s verify/Tai888-Reader/background.js
          node -e "const m=require('./verify/Tai888-Reader/manifest.json'); if(m.version!=='2.0.2') throw new Error('bad version'); if(m.permissions.includes('tabs')||m.permissions.includes('cookies')) throw new Error('excess permission'); if(!m.content_scripts[0].js.includes('capture-policy.js')) throw new Error('capture policy missing')"
          node --check verify/Tai888-Reader/background.js
          node --check verify/Tai888-Reader/parser.js
          node --check verify/Tai888-Reader/capture-policy.js
          node --check verify/Tai888-Reader/row-normalizer.js
          node --check verify/Tai888-Reader/tai888-content.js
          node --check verify/Tai888-Reader/popup.js
          test "$(stat -c%s dist/Tai888-Reader-v2.0.2.zip)" -gt 10000
          sha256sum dist/Tai888-Reader-v2.0.2.zip | tee dist/Tai888-Reader-v2.0.2.sha256.txt
          unzip -l dist/Tai888-Reader-v2.0.2.zip

      - name: Write release verification report
        run: |
          cat > dist/RELEASE-VERIFICATION.txt <<EOF
          MLB EV website version: 9.4.1
          Tai888 Reader version: 2.0.2
          Source commit before generated patch: $GITHUB_SHA
          Regression tests: PASS
          npm high/critical production audit: PASS
          Next.js production build: PASS
          Local Pair/Ingest/Credit/Analyze/Reprice E2E: PASS
          Split-row 8/8 fixture and special-market exclusion: PASS
          One-cell league marker, div-grid and shadow-root capture policy: PASS
          Heartbeat freshness propagation: PASS
          ZIP CRC, required files, syntax and manifest permissions: PASS
          EOF

      - name: Commit verified generated production source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            package.json DEPLOYMENT_VERSION \
            app/page.js app/api/health/route.js app/api/credit-lines/route.js app/api/analyze/route.js app/api/reprice/route.js \
            lib/deterministic-finalizer.js \
            reader scripts lib app/api/reader
          git commit -m "Release MLB EV v9.4.1 with Tai888 Reader v2.0.2" || true
          git push origin HEAD:fix/tai888-reader-v2-0-2-production

      - uses: actions/upload-artifact@v4
        with:
          name: Tai888-Reader-v2.0.2-FINAL-VERIFIED
          path: |
            dist/Tai888-Reader-v2.0.2.zip
            dist/Tai888-Reader-v2.0.2.sha256.txt
            dist/RELEASE-VERIFICATION.txt
          if-no-files-found: error
          retention-days: 30
