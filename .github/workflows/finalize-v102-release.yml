name: Finalize v10.2 release

on:
  push:
    branches: [verify/v102-full-ci-6b]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[v102-release-finalized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify/v102-full-ci-6b
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/finalize-v102-release.mjs
      - run: node scripts/score-model-integrity-v102-test.mjs
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
      - run: node scripts/package-reader.mjs release
      - name: Commit verified release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: finalize v10.2.0 and pass full verification [v102-release-finalized]"
          git push origin HEAD:verify/v102-full-ci-6b
