name: Patch MLB data endpoints v10.1.2

on:
  push:
    branches: [fix/v1012-mlb-data-endpoints]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v1012-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1012-mlb-data-endpoints
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-mlb-data-endpoints-v1012.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/mlb-context-v11.js app/api/analyze/route.js
          git commit -m "fix: repair MLB StatsAPI point-in-time requests [v1012-applied]"
          git push origin HEAD:fix/v1012-mlb-data-endpoints
