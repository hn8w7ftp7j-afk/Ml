name: Apply show-all ranking
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.pull_request.head.sha || '', '[ranking-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/show-all-ranking-directions
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-show-all-ranking.mjs
      - run: npm test
      - run: npm run build
      - run: |
          rm scripts/apply-show-all-ranking.mjs .github/workflows/apply-show-all-ranking.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: show every analyzed direction in ranking [ranking-applied]"
          git push origin HEAD:fix/show-all-ranking-directions
