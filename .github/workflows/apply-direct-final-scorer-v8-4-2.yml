name: Apply direct final scorer v8.4.2

on:
  push:
    branches:
      - fix/gpt-final-direct-fallback-v8-4-2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-direct-final-scorer-v8-4-2
  cancel-in-progress: false

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply v8.4.2 scoring service fallback patch
        run: python scripts/apply-direct-final-scorer-v8-4-2.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Run parity, final scorer, unit, security and Production build
        run: npm run build
      - name: Commit verified release
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/apply-direct-final-scorer-v8-4-2.yml scripts/apply-direct-final-scorer-v8-4-2.py
          git add -A
          git commit -m 'Add AI Gateway retry and direct OpenAI final scorer fallback v8.4.2 [verified]'
          git push origin HEAD:fix/gpt-final-direct-fallback-v8-4-2
