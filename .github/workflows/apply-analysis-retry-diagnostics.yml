name: Apply analysis retry diagnostics
on:
  push:
    branches: [fix/v102-analysis-retry-diagnostics]
permissions:
  contents: write
jobs:
  patch-test:
    if: ${{ !contains(github.event.head_commit.message, '[analysis-retry-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v102-analysis-retry-diagnostics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-analysis-retry-diagnostics.mjs
      - run: node scripts/analysis-retry-diagnostics-test.mjs
      - run: npm test
      - run: npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: retry transient analysis failures and expose diagnostics [analysis-retry-applied]"
          git push origin HEAD:fix/v102-analysis-retry-diagnostics
